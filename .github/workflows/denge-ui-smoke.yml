name: Denge PC and Android viewport smoke tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "public/index.html"
      - "service-worker.js"
      - ".github/workflows/denge-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server and run PC/mobile tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/denge-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p test-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              { name: 'PC desktop', viewport: { width: 1440, height: 900 }, mobile: false, dpr: 1 },
              { name: 'Android mobile viewport', viewport: { width: 384, height: 854 }, mobile: true, dpr: 3 }
            ];
            const results = [];
            for (const target of targets) {
              const context = await browser.newContext({
                viewport: target.viewport,
                deviceScaleFactor: target.dpr,
                isMobile: target.mobile,
                hasTouch: target.mobile
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(1800);
              const offlineContinue = page.locator('#cloudAuthOffline');
              if (await offlineContinue.isVisible()) await offlineContinue.click();
              await page.waitForTimeout(250);
              if (!(await page.title()).includes('Denge')) throw new Error(target.name + ': page title missing');
              const bodyText = await page.locator('body').innerText(); console.log(target.name + ' body: ' + bodyText.slice(0,1200)); console.log(target.name + ' page errors: ' + JSON.stringify(pageErrors)); if (bodyText.trim().length < 5) throw new Error(target.name + ': app root stayed empty; pageErrors=' + pageErrors.join(' | '));

              await page.locator('button.navitem[data-nav="profile"]').click();
              await page.getByText('Hesap yönetimi', { exact: true }).waitFor({ timeout: 5000 });
              await page.getByText('Finans araçları', { exact: true }).waitFor({ timeout: 5000 });
              if (!(await page.getByText('Bütçe & Hedefler', { exact: true }).count())) throw new Error(target.name + ': budget link missing');

              await page.locator('button[data-nav="debtOverview"]').click();
              await page.getByText('Borç / Alacak', { exact: true }).waitFor({ timeout: 5000 });

              await page.locator('button[data-nav="profile"]').first().click();
              await page.locator('button[data-nav="settings"]').first().click();
              await page.getByText('Veri yönetimi', { exact: true }).waitFor({ timeout: 5000 });
              await page.getByText('Görünüm', { exact: true }).waitFor({ timeout: 5000 });

              const dimensions = await page.evaluate(() => ({
                width: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                height: window.innerHeight
              }));
              if (dimensions.documentWidth > dimensions.width + 2) {
                throw new Error(target.name + ': horizontal overflow ' + JSON.stringify(dimensions));
              }
              if (pageErrors.length) throw new Error(target.name + ': uncaught JS errors: ' + pageErrors.join(' | '));

              await page.screenshot({ path: 'test-artifacts/' + (target.mobile ? 'android-mobile' : 'pc-desktop') + '.png', fullPage: true });
              results.push({ target: target.name, status: 'PASS', dimensions, pageErrors });
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('test-artifacts/results.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: denge-pc-android-smoke-results
          path: test-artifacts/
