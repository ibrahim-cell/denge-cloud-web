name: Denge PC and Android viewport smoke tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "public/index.html"
      - "service-worker.js"
      - ".github/workflows/denge-ui-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "public/index.html"
      - "service-worker.js"
      - ".github/workflows/denge-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server and run PC/mobile tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/denge-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p test-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              { name: 'PC desktop', viewport: { width: 1440, height: 900 }, mobile: false, dpr: 1 },
              { name: 'Android mobile viewport', viewport: { width: 384, height: 854 }, mobile: true, dpr: 3 }
            ];
            const results = [];
            for (const target of targets) {
              const context = await browser.newContext({
                viewport: target.viewport,
                deviceScaleFactor: target.dpr,
                isMobile: target.mobile,
                hasTouch: target.mobile
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(1800);
              const offlineContinue = page.locator('#cloudAuthOffline');
              if (await offlineContinue.isVisible()) await offlineContinue.click();
              await page.waitForTimeout(250);
              if (!(await page.title()).includes('Denge')) throw new Error(target.name + ': page title missing');
              const bodyText = await page.locator('body').innerText(); console.log(target.name + ' body: ' + bodyText.slice(0,1200)); console.log(target.name + ' page errors: ' + JSON.stringify(pageErrors)); if (bodyText.trim().length < 5) throw new Error(target.name + ': app root stayed empty; pageErrors=' + pageErrors.join(' | '));

              await page.locator('button.navitem[data-nav="profile"]').click();
              await page.getByText('Hesap yönetimi', { exact: true }).waitFor({ timeout: 5000 });
              await page.getByText('Finans araçları', { exact: true }).waitFor({ timeout: 5000 });
              if (!(await page.getByText('Bütçe & Hedefler', { exact: true }).count())) throw new Error(target.name + ': budget link missing');

              const profileRoutes = [
                { nav: 'accounts', heading: 'Hesaplar', back: 'button[data-nav="profile"]' },
                { nav: 'categories', heading: 'Kategoriler', back: 'button[data-nav="profile"]' },
                { nav: 'budget', heading: 'Hedefler & Bütçe', back: 'button[data-nav="profile"]' },
                { nav: 'networth', heading: 'Net Varlık Geçmişi', back: '.nw-back[data-nav="profile"]' },
                { nav: 'debtOverview', heading: 'Borç / Alacak', back: 'button[data-nav="profile"]' },
                { nav: 'reminders', heading: 'Hatırlatmalar', back: 'button[data-nav="profile"]' },
                { nav: 'recurring', heading: 'Düzenli Ödemeler', back: 'button[data-nav="profile"]' },
                { nav: 'about', heading: 'Hakkında', back: 'button[data-nav="profile"]' }
              ];
              for (const route of profileRoutes) {
                await page.locator('button.navitem[data-nav="profile"]').click();
                await page.locator('#app .profile-head h1').waitFor({ timeout: 5000 });
                await page.locator('button[data-nav="' + route.nav + '"]').first().click();
                await page.getByRole('heading', { name: route.heading, exact: true }).waitFor({ timeout: 5000 });
                await page.locator(route.back).first().click();
                await page.locator('#app .profile-head h1').waitFor({ timeout: 5000 });
              }

              await page.locator('button[data-nav="debtOverview"]').click();
              await page.getByText('Borç / Alacak', { exact: true }).waitFor({ timeout: 5000 });

              await page.locator('button[data-nav="profile"]').first().click();
              await page.locator('button[data-nav="settings"]').first().click();
              await page.getByText('Veri yönetimi', { exact: true }).waitFor({ timeout: 5000 });
              await page.getByText('Görünüm', { exact: true }).waitFor({ timeout: 5000 });
              await page.locator('#exportData .seticon svg').waitFor({ state: 'attached', timeout: 5000 });
              if (await page.locator('#exportData .seticon').innerText() !== '') {
                throw new Error(target.name + ': export icon should be SVG, not a text glyph');
              }

              // Budget and savings goals
              await page.locator('button.navitem[data-nav="profile"]').click();
              await page.locator('button[data-nav="budget"]').click();
              await page.locator('#budgetSpendableSummary').waitFor({ timeout: 5000 });
              await page.locator('#addBudget').click();
              await page.locator('#budgetAmount').fill('2500');
              await page.locator('#budgetSave').click();
              await page.locator('.budget-item').first().waitFor({ timeout: 5000 });
              await page.locator('#addGoal').click();
              await page.locator('#goalName').fill('Smoke birikim hedefi');
              await page.locator('#goalTarget').fill('1000');
              await page.locator('#goalSaved').fill('100');
              await page.locator('#goalAutoAmount').fill('50');
              await page.locator('#goalAutoDay').fill('28');
              await page.locator('#goalSave').click();
              await page.locator('[data-goal-contribute]').first().click();
              await page.locator('#goalContributionAmount').fill('25');
              await page.locator('#goalContributionSave').click();
              await page.getByText('Smoke birikim hedefi', { exact: true }).waitFor({ timeout: 5000 });

              // Account type and assets/liabilities breakdown
              await page.locator('button.navitem[data-nav="profile"]').click();
              await page.locator('button[data-nav="accounts"]').first().click();
              await page.locator('#addAccount').click();
              await page.locator('#accountName').fill('Smoke Kripto');
              await page.locator('#accountType').selectOption('crypto');
              await page.locator('#accountOpening').fill('500');
              await page.locator('#accountSave').click();
              await page.getByText('Kripto', { exact: true }).waitFor({ timeout: 5000 });
              await page.locator('.account-summary-grid').waitFor({ timeout: 5000 });

              // Reports, comparisons and forecast
              await page.locator('button.navitem[data-nav="analysis"]').click();
              await page.locator('[data-report-period="year"]').click();
              await page.getByText('Önümüzdeki 3 ay tahmini', { exact: true }).waitFor({ timeout: 5000 });
              await page.locator('[data-report-period="month"]').click();
              await page.getByText('Önceki dönem karşılaştırması', { exact: true }).waitFor({ timeout: 5000 });

              // Debt ledger: create, edit debt, edit/delete repayment, and cascade delete
              await page.locator('button.navitem[data-nav="profile"]').click();
              await page.locator('button[data-nav="debtOverview"]').first().click();
              await page.locator('#addDetailedDebt').click();
              await page.locator('#debtRecordPerson').waitFor({ state: 'visible', timeout: 5000 });
              await page.locator('#debtRecordPerson').fill('Smoke Borç Kişisi');
              await page.locator('#debtRecordAmount').fill('500');
              await page.locator('#debtRecordRate').fill('1');
              // The due date now uses Denge's in-app calendar, not a visible native input.
              const debtDueDate = new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10);
              await page.locator('[data-styled-date="debtRecordDue"]').click();
              await page.locator('.cal-modal [data-iso="' + debtDueDate + '"]').click();
              await page.locator('#calOk').click();
              if (await page.locator('#debtRecordDue').inputValue() !== debtDueDate) {
                throw new Error(target.name + ': themed due-date picker did not apply the selected date');
              }
              await page.locator('#debtRecordSave').click();
              await page.getByText('Smoke Borç Kişisi', { exact: true }).waitFor({ timeout: 5000 });

              await page.locator('[data-debt-payment]').first().click();
              await page.locator('#debtPaymentAmount').fill('100');
              await page.locator('#debtPaymentSave').click();
              await page.getByText('Ödeme geçmişi (1)', { exact: true }).waitFor({ timeout: 5000 });

              await page.locator('[data-debt-edit]').first().click();
              await page.locator('#debtRecordPerson').fill('Smoke Düzenlenen Borç');
              await page.locator('#debtRecordSave').click();
              await page.getByText('Smoke Düzenlenen Borç', { exact: true }).waitFor({ timeout: 5000 });

              await page.locator('[data-debt-history]').first().click();
              await page.locator('[data-payment-edit]').first().click();
              await page.locator('#debtPaymentEditAmount').fill('120');
              await page.locator('#debtPaymentEditSave').click();
              await page.getByText('Ödeme geçmişi (1)', { exact: true }).waitFor({ timeout: 5000 });

              await page.locator('[data-debt-history]').first().click();
              await page.locator('[data-payment-delete]').first().click();
              await page.locator('#txDelOk').click();
              await page.getByText('Ödeme geçmişi (0)', { exact: true }).waitFor({ timeout: 5000 });

              // Deleting the opening movement from İşlemler must also remove its debt card.
              await page.locator('#addDetailedDebt').click();
              await page.locator('#debtRecordPerson').fill('Smoke Silinecek Borç');
              await page.locator('#debtRecordAmount').fill('200');
              await page.locator('#debtRecordSave').click();
              await page.locator('button.navitem[data-nav="transactions"]').click();
              await page.locator('#app [data-detail]').filter({ hasText: 'Smoke Silinecek Borç' }).first().click();
              await page.locator('#txDeleteBtn').click();
              await page.locator('#txDelOk').click();
              await page.locator('button.navitem[data-nav="profile"]').click();
              await page.locator('button[data-nav="debtOverview"]').first().click();
              if (await page.getByText('Smoke Silinecek Borç', { exact: true }).count()) {
                throw new Error(target.name + ': deleting the opening debt transaction left an orphan debt record');
              }

              // Quick entry: borrow 300 into Banka.
              await page.locator('#debtOverviewAdd').click();
              await page.locator('#debtPerson').fill('Smoke Aldığım Borç');
              await page.locator('#debtAmount').fill('300');
              await page.locator('#debtAccount').selectOption({ label: 'Banka' });
              await page.locator('[data-debt-kind="alindi"]').click();
              await page.locator('#saveTx').click();
              await page.getByText('Smoke Aldığım Borç', { exact: true }).waitFor({ timeout: 5000 });

              // Create a separate receivable to test collection.
              await page.locator('#debtOverviewAdd').click();
              await page.locator('#debtPerson').fill('Smoke Tahsilat Kaynağı');
              await page.locator('#debtAmount').fill('180');
              await page.locator('#debtAccount').selectOption({ label: 'Banka' });
              await page.locator('[data-debt-kind="verildi"]').click();
              await page.locator('#saveTx').click();
              await page.getByText('Smoke Tahsilat Kaynağı', { exact: true }).waitFor({ timeout: 5000 });

              // Collect 40: account increases and receivable falls from 180 to 140.
              await page.locator('#debtOverviewAdd').click();
              await page.locator('[data-debt-kind="tahsilat"]').click();
              const receivableOption = await page.locator('#debtTargetRecord option').filter({ hasText: 'Smoke Tahsilat Kaynağı' }).getAttribute('value');
              await page.locator('#debtTargetRecord').selectOption(receivableOption);
              await page.locator('#debtAmount').fill('40');
              await page.locator('#debtAccount').selectOption({ label: 'Banka' });
              await page.locator('#saveTx').click();
              const collectionState = await page.evaluate(() => {
                const d = window.__dengeCloudBridge.getData();
                const debt = d.debts.find(x => x.person === 'Smoke Tahsilat Kaynağı');
                return { remaining: debt && debt.remaining, direction: debt && debt.direction,
                  payment: d.transactions.find(x => x.debtId === debt.id && x.debtAction === 'payment')?.amount };
              });
              if (collectionState.remaining !== 140 || collectionState.direction !== 'receivable' || collectionState.payment !== 40) {
                throw new Error(target.name + ': collection did not reduce receivable correctly ' + JSON.stringify(collectionState));
              }

              // Repay 70: account decreases and payable falls from 300 to 230.
              await page.locator('#debtOverviewAdd').click();
              await page.locator('[data-debt-kind="geriOdeme"]').click();
              const payableOption = await page.locator('#debtTargetRecord option').filter({ hasText: 'Smoke Aldığım Borç' }).getAttribute('value');
              await page.locator('#debtTargetRecord').selectOption(payableOption);
              await page.locator('#debtAmount').fill('70');
              await page.locator('#debtAccount').selectOption({ label: 'Banka' });
              await page.locator('#saveTx').click();
              const repaymentState = await page.evaluate(() => {
                const d = window.__dengeCloudBridge.getData();
                const debt = d.debts.find(x => x.person === 'Smoke Aldığım Borç');
                const account = d.accounts.find(x => x.name === 'Banka');
                let balance = Number(account.openingBalance || 0);
                d.transactions.forEach(t => {
                  if (t.type === 'transfer') {
                    if (t.fromAccount === 'Banka') balance -= Number(t.transferAmount || t.amount || 0);
                    if (t.toAccount === 'Banka') balance += Number(t.transferAmount || t.amount || 0);
                  } else if (t.account === 'Banka') balance += Number(t.amount || 0);
                });
                return { remaining: debt && debt.remaining, direction: debt && debt.direction, balance };
              });
              if (repaymentState.remaining !== 230 || repaymentState.direction !== 'payable' || repaymentState.balance !== 90) {
                throw new Error(target.name + ': repayment/account balance mismatch ' + JSON.stringify(repaymentState));
              }

              // Quick widget note persists through app state and render
              await page.locator('button.navitem[data-nav="home"]').click();
              await page.locator('#widgetNoteInput').fill('Smoke widget notu');
              await page.locator('#saveWidgetNote').click();
              await page.locator('#widgetNoteInput').waitFor({ timeout: 5000 });
              if (await page.locator('#widgetNoteInput').inputValue() !== 'Smoke widget notu') {
                throw new Error(target.name + ': widget note did not persist');
              }

              const dimensions = await page.evaluate(() => ({
                width: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                height: window.innerHeight
              }));
              if (dimensions.documentWidth > dimensions.width + 2) {
                throw new Error(target.name + ': horizontal overflow ' + JSON.stringify(dimensions));
              }
              if (pageErrors.length) throw new Error(target.name + ': uncaught JS errors: ' + pageErrors.join(' | '));

              await page.screenshot({ path: 'test-artifacts/' + (target.mobile ? 'android-mobile' : 'pc-desktop') + '.png', fullPage: true });
              results.push({ target: target.name, status: 'PASS', dimensions, pageErrors });
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('test-artifacts/results.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: denge-pc-android-smoke-results
          path: test-artifacts/
