name: Unpack Denge Cloud Web package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-denge-site.yml"
      - "DengeCloudWeb-1.1.1-GitHub-Upload.zip"

permissions:
  contents: write

jobs:
  unpack-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract site package into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="DengeCloudWeb-1.1.1-GitHub-Upload.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Upload $ZIP_FILE to the repository root before running this workflow."
            exit 1
          fi
          rm -rf .denge-unpack
          mkdir .denge-unpack
          unzip -q "$ZIP_FILE" -d .denge-unpack
          SITE_DIR=".denge-unpack/Denge-Cloud-Web-1.1.1"
          test -f "$SITE_DIR/index.html"
          test -d "$SITE_DIR/assets/brand"
          cp -a "$SITE_DIR/." .
          rm -rf .denge-unpack "$ZIP_FILE"

      - name: Verify extracted files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f cloud-config.js
          test -f cloud-sync.js
          test -d assets/brand
          find assets/brand -maxdepth 1 -type f | sort
          echo "Denge Cloud Web source and brand assets are present."

      - name: Commit unpacked application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Denge Cloud Web 1.1.1 source and brand assets"
            git push origin HEAD:main
          fi
