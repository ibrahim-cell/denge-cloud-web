name: Unpack Denge Cloud Web package

on:
  push:
    branches: [main]
    paths:
      - "Denge-Cloud-Web-1.1.1-Vercel-Ready.zip"

permissions:
  contents: write

jobs:
  unpack-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract site package into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f "Denge-Cloud-Web-1.1.1-Vercel-Ready.zip"
          rm -rf .denge-unpack
          mkdir .denge-unpack
          unzip -q "Denge-Cloud-Web-1.1.1-Vercel-Ready.zip" -d .denge-unpack
          test -f ".denge-unpack/Denge-Cloud-Web-1.1.1/index.html"
          cp -a ".denge-unpack/Denge-Cloud-Web-1.1.1/." .
          rm -rf .denge-unpack "Denge-Cloud-Web-1.1.1-Vercel-Ready.zip"

      - name: Commit unpacked application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Denge Cloud Web 1.1.1 source and assets"
            git push origin HEAD:main
          fi
