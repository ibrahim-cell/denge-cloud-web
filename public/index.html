ground:#fff;color:#707789;font-size:11px;font-weight:800}.debt-choice button.active{background:#fff0e8;border-color:#e6a07c;color:#b85f3d}.txrow.transfer .caticon{background:#eeebff;color:#6256df}.txrow.debt .caticon{background:#fff0e8;color:#c96a43}.txrow.transfer strong{color:#6256df}.txrow.debt strong{color:#c96a43}.dark .type-btn{background:#202332;border-color:#303345;color:#aeb4c5}.dark .type-btn.transfer-type.active{background:#29254b;border-color:#6758ef;color:#aaa0ff}.dark .type-btn.debt-type.active{background:#3a2924;border-color:#9d6448;color:#f0a17d}.dark .special-ico{width:28px;height:28px;display:grid;place-items:center;flex-shrink:0}.special-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.special-fields{background:#211f31;border-color:#353149}.dark .special-title b{color:#eef0fa}.dark .special-title small{color:#9fa5b8}.dark .special-fields .field,.dark .debt-choice button{background:#202332;border-color:#303345;color:#eef0fa}.dark .debt-choice button.active{background:#3a2924;border-color:#9d6448;color:#f0a17d}

/* Denge Cloud full-screen authentication */
.cloud-auth-overlay{z-index:10000;overflow-y:auto;background:linear-gradient(135deg,rgba(13,17,52,.97),rgba(45,22,113,.96) 54%,rgba(7,73,105,.96));backdrop-filter:blur(22px) saturate(.72);-webkit-backdrop-filter:blur(22px) saturate(.72);padding:26px}
.cloud-auth-overlay:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 16% 18%,rgba(44,220,235,.30),transparent 34%),radial-gradient(ellipse at 83% 23%,rgba(235,70,185,.26),transparent 31%),radial-gradient(ellipse at 76% 88%,rgba(107,73,239,.34),transparent 35%);opacity:.9}
.cloud-auth-card{position:relative;z-index:1;width:min(100%,440px);max-height:calc(100vh - 52px);overflow:auto;border:1px solid rgba(255,255,255,.86);border-radius:29px;background:#fff;padding:45px 34px 28px;box-shadow:0 30px 90px rgba(4,5,24,.38);color:#20243a;text-align:left}
.cloud-auth-close{position:absolute;right:15px;top:13px;width:34px;height:34px;border-radius:50%;background:#f0f1f7;color:#7c8293;font-size:23px;line-height:1}
.cloud-auth-emblem{width:72px;height:72px;border-radius:50%;padding:6px;background:linear-gradient(140deg,#29c7dc,#7564ef,#ec62bd);box-shadow:0 8px 24px rgba(103,88,239,.28);margin:-12px auto 15px;position:relative;display:grid;place-items:center}
.cloud-auth-emblem img{width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff}
.cloud-auth-lock{position:absolute;right:-3px;bottom:-2px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#7059ed;color:#fff;border:2px solid #fff}
.cloud-auth-lock svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cloud-auth-brand{text-align:center;color:#695ce7;font-size:11px;font-weight:900;letter-spacing:2px}
.cloud-auth-card h2{text-align:center;color:#35b4cc;font-size:25px;line-height:1.2;margin:8px 0 7px;font-weight:850}
.cloud-auth-intro{text-align:center;color:#9298a8;font-size:12px;line-height:1.55;margin:0 0 23px}
.cloud-auth-form{display:grid;gap:12px}
.cloud-auth-card .cloud-field{margin:0}
.cloud-auth-card .cloud-field label{font-size:11px;color:#8b91a0;margin:0 0 6px 2px}
.cloud-auth-card .cloud-field input{height:48px;border:1px solid #e6e7ed;background:#f1f2f5;border-radius:999px;padding:0 17px;font-size:13px;color:#252b3b}
.cloud-auth-card .cloud-field input:focus{background:#fff;border-color:#38b7d0;box-shadow:0 0 0 3px rgba(56,183,208,.13)}
.cloud-password-wrap{position:relative;display:flex;align-items:center}.cloud-auth-card .cloud-password-wrap input{width:100%;padding-right:55px}.cloud-eye-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#7d8495;background:transparent;z-index:2}.cloud-eye-toggle:hover{background:#e4e8f1;color:#35aeca}.cloud-eye-toggle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dark .cloud-eye-toggle{color:#b5bdd1}.dark .cloud-eye-toggle:hover{background:#30354a;color:#66cce0}
.cloud-auth-remember{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 1px 1px;font-size:11px;color:#9298a7}
.cloud-auth-remember label{display:flex;align-items:center;gap:6px;cursor:pointer}
.cloud-auth-remember input{accent-color:#39b8d0}
.cloud-auth-link{border:0;background:none;color:#35aeca;font-size:11px;font-weight:750;padding:5px 0}
.cloud-auth-error{min-height:16px;text-align:center;font-size:11px;color:#d54e63}
.cloud-auth-error.success{color:#13865e}
.cloud-auth-submit{width:100%;height:49px;border-radius:999px;background:linear-gradient(100deg,#36bed0,#34b0d0);color:#fff;font-size:12px;font-weight:900;letter-spacing:.5px;box-shadow:0 9px 20px rgba(51,178,205,.2)}
.cloud-auth-submit:disabled{opacity:.55;cursor:wait}
.cloud-auth-switch{text-align:center;color:#8990a0;font-size:11px;margin-top:17px}
.cloud-auth-switch button{border:0;background:none;color:#32aec8;font-size:11px;font-weight:850;padding:3px 2px}
.cloud-auth-offline{display:block;margin:15px auto 0;border:0;background:none;color:#9da2af;font-size:10px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.cloud-auth-success{padding:15px;border-radius:16px;background:#eaf8f1;color:#187c59;text-align:center;font-size:12px;line-height:1.6;margin-top:8px}

/* PIN security helpers — SHA-256 hash, never store plain PIN */
const PIN_SALT='denge-pin-v1';
async function hashPin(pin){
  const enc=new TextEncoder();
  const buf=await crypto.subtle.digest('SHA-256',enc.encode(PIN_SALT+':'+String(pin||'')));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isPlainPin(v){return typeof v==='string'&&/^\d{4}$/.test(v)}
async function verifyPin(input){
  const stored=data.settings.pin||'';
  if(!stored) return false;
  if(isPlainPin(stored)){
    // migrate legacy plain PIN on successful match
    if(input===stored){data.settings.pin=await hashPin(input);save();return true}
    return false;
  }
  const h=await hashPin(input);
  return h===stored;
}
function emptyState(icon,title,desc,ctaLabel,ctaAttr){
  return '<div class="empty-state"><div class="empty-ico">'+sicon(icon||'wallet')+'</div><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p>'

}
function normalizeRecurringDay(value,fallback=1){
 const parsed=Number.parseInt(value,10);
 return Number.isInteger(parsed)?Math.min(31,Math.max(1,parsed)):fallback;
}
function recurringDateForMonth(year,monthIndex,day){
 const maxDay=new Date(year,monthIndex+1,0).getDate();
 return new Date(year,monthIndex,Math.min(maxDay,normalizeRecurringDay(day,1)));
}
function optionalRecurringDayValue(value){
 if(value===null||value===undefined||String(value).trim()==='')return null;
 const parsed=Number(value);
 return Number.isInteger(parsed)&&parsed>=1&&parsed<=31?parsed:NaN;
}
function processRecurring(){
  data.recurring=Array.isArray(data.recurring)?data.recurring:[];
  if(!data.recurring.length) return;
  const now=new Date();
  const ym=currentMonth();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let changed=false;
  data.recurring.forEach(r=>{
    if(!r||r.active===false||r.id==null) return;
    const rDay=normalizeRecurringDay(r.dayOfMonth,1);
    const dueDate=recurringDateForMonth(now.getFullYear(),now.getMonth(),rDay);
    const actualDay=dueDate.getDate();
    if(!Array.isArray(r.generatedMonths)){r.generatedMonths=[];changed=true;}
    // Migrate legacy entries without backfilling a payment whose due date
    // had already passed before this migration was first run.
    if(!r.createdAt){
      r.createdAt=now.toISOString();
      if(dueDate<today&&!r.generatedMonths.includes(ym))r.generatedMonths.push(ym);
      changed=true;
    }
    const createdAt=new Date(r.createdAt);
    const createdDate=Number.isNaN(createdAt.getTime())?today:new Date(createdAt.getFullYear(),createdAt.getMonth(),createdAt.getDate());
    if(today<dueDate||createdDate>dueDate)return;
    if(r.generatedMonths.includes(ym))return;
    const existing=data.transactions.some(t=>String(t.recurringId)===String(r.id)&&String(t.date||'').slice(0,7)===ym);
    if(existing){r.generatedMonths.push(ym);changed=true;return;}
    const id='recurring-'+encodeURIComponent(String(r.id))+'-'+ym;
    const deleted=data._denge_deleted&&data._denge_deleted.transactions;
    if(deleted&&Object.prototype.hasOwnProperty.call(deleted,String(id))){r.generatedMonths.push(ym);changed=true;return;}
    const amt=Number(r.amount)||0;
    const signed=r.type==='income'?Math.abs(amt):-Math.abs(amt);
    const date=ym+'-'+String(actualDay).padStart(2,'0');
    data.transactions.unshift({
      id,type:r.type==='income'?'income':'expense',
      name:(r.name||'Tekrarlayan')+' \u21bb',
      category:r.category||'Diğer',
      amount:signed,date,time:'00:00',
      account:r.account||((data.accounts||[])[0]||{}).name||'',
      recurringId:r.id
    });
    r.generatedMonths.push(ym);
    changed=true;
  });
  if(changed) save();
}


function inferAccountType(name){
 const n=String(name||'').trim().toLocaleLowerCase('tr-TR');
 if(n.includes('kredi kart'))return 'credit';
 if(n.includes('kripto')||n.includes('bitcoin')||n.includes('btc'))return 'crypto';
 if(n.includes('yatırım')||n.includes('hisse')||n.includes('fon')||n.includes('altın'))return 'investment';
 if(n.includes('birikim')||n.includes('tasarruf')||n.includes('vadeli'))return 'saving';
 if(n.includes('banka')||n.includes('iban'))return 'bank';
 return 'cash';
}
function accountTypeOf(account){const type=String(account&&account.type||'');return ['cash','bank','credit','saving','investment','crypto'].includes(type)?type:inferAccountType(account&&account.name)}
function accountTypeLabel(type){return ({cash:'Nakit',bank:'Banka',credit:'Kredi kartı',saving:'Birikim',investment:'Yatırım',crypto:'Kripto'})[type]||'Nakit'}
function accountBalanceSummary(){
 const balances=computedAccountBalances();let assets=0,liabilities=0;
 (data.accounts||[]).filter(a=>isRealAccount(a.name)).forEach(a=>{const value=Number(balances[a.name]||0);if(value>=0)assets+=value;else liabilities+=Math.abs(value)});
 return {assets,liabilities,net:assets-liabilities,balances};
}
function budgetMetricsForMonth(ym){
 const tx=(data.transactions||[]).filter(t=>String(t.date||'').slice(0,7)===ym&&t.type!=='transfer'&&t.type!=='debt');
 const income=tx.filter(t=>Number(t.amount||0)>0).reduce((s,t)=>s+Number(t.amount||0),0);
 const expense=-tx.filter(t=>Number(t.amount||0)<0).reduce((s,t)=>s+Number(t.amount||0),0);
 const byCategory={};tx.filter(t=>Number(t.amount||0)<0).forEach(t=>{const k=String(t.category||'Diğer');byCategory[k]=(byCategory[k]||0)+Math.abs(Number(t.amount)||0)});
 const entries=Object.entries(data.budgets||{}).filter(([,v])=>Number(v)>0);
 const budgetRemaining=entries.reduce((s,[k,v])=>s+(Number(v||0)-Number(byCategory[k]||0)),0);
 const cashflowRemaining=income-expense;
 const available=entries.length?Math.max(0,Math.min(cashflowRemaining,budgetRemaining)):Math.max(0,cashflowRemaining);
 const now=new Date(),isCurrent=ym===now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
 const daysLeft=isCurrent?new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1:new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate();
 return {income,expense,byCategory,budgetRemaining,cashflowRemaining,available,daysLeft,dailyAvailable:daysLeft>0?available/daysLeft:0};
}
function debtPrincipalRemaining(debt){
 const fallback=Number(debt&&debt.remaining!==undefined?debt.remaining:debt&&debt.amount)||0;
 return Math.max(0,Number(debt&&debt.principalRemaining!==undefined?debt.principalRemaining:fallback)||0);
}
function debtAccruedInterest(debt,now=new Date()){
 const rate=Math.max(0,Number(debt&&debt.interestRateMonthly)||0);
 const start=new Date(debt&&(debt.interestLastCalculatedAt||debt.createdAt)||now);
 if(!rate||Number.isNaN(start.getTime()))return Math.max(0,Number(debt&&debt.interestBalance)||0);
 const elapsed=Math.max(0,(now.getTime()-start.getTime())/(86400000*30.4375));
 const base=debtPrincipalRemaining(debt);
 return Math.max(0,Math.round((Number(debt&&debt.interestBalance||0)+base*rate/100*elapsed)*100)/100);
}
function debtOutstanding(debt,now=new Date()){
 if(!debt||debt.status==='closed')return 0;
 return Math.round((debtPrincipalRemaining(debt)+debtAccruedInterest(debt,now))*100)/100;
}
function syncDebtReminder(debt){
 if(!debt||debt.id==null)return;
 data.reminders=Array.isArray(data.reminders)?data.reminders:[];
 const id='debt-due-'+String(debt.id);
 let reminder=data.reminders.find(r=>String(r.id)===id);
 if(!debt.dueDate){
  if(reminder)data.reminders=data.reminders.filter(r=>String(r.id)!==id);
  return;
 }
 if(!reminder){reminder={id,source:'debt',sourceId:String(debt.id)};data.reminders.push(reminder)}
 reminder.title=(debt.direction==='payable'?'Borç ödeme vadesi: ':'Alacak tahsilat vadesi: ')+String(debt.person||'Kişi');
 reminder.date=String(debt.dueDate);reminder.amount=debtOutstanding(debt);
 reminder.daysBefore=Math.max(0,Number(debt.reminderDays??3));reminder.time=String(debt.reminderTime||'09:00');
 reminder.repeatMonthly=false;reminder.active=data.settings.debtDueReminders!==false&&debt.status!=='closed'&&reminder.amount>0;
 reminder.note='Denge borç/alacak vade hatırlatması';
}
function isDebtPaymentTransaction(tx){
 if(!tx||tx.type!=='debt')return false;
 if(tx.debtPaymentId||tx.debtAction==='payment')return true;
 return ['Tahsilat','Ödeme','Borç tahsilatı','Borç geri ödemesi'].includes(String(tx.debtTypeLabel||tx.name||''));
}
function recalculateDebtLedger(debt){
 if(!debt)return {ok:false,reason:'missing'};
 const principalBase=Math.max(0,Number(debt.principalAmount!==undefined?debt.principalAmount:debt.amount)||0);
 const rate=Math.max(0,Number(debt.interestRateMonthly)||0);
 let principal=principalBase,interest=0,last=new Date(debt.createdAt||localDateISO()+'T12:00:00');
 if(Number.isNaN(last.getTime()))last=new Date(localDateISO()+'T12:00:00');
 const payments=(Array.isArray(debt.payments)?debt.payments:[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
 for(const payment of payments){
  const when=new Date(String(payment.date||localDateISO()).slice(0,10)+'T12:00:00');
  if(Number.isNaN(when.getTime()))return {ok:false,reason:'invalid-date'};
  if(when<last)when.setTime(last.getTime());
  const elapsed=Math.max(0,(when.getTime()-last.getTime())/(86400000*30.4375));
  interest=Math.max(0,interest+principal*rate/100*elapsed);
  const amount=Math.max(0,Number(payment.amount)||0);
  if(amount>principal+interest+0.01)return {ok:false,reason:'overpayment',payment,available:principal+interest};
  const interestPaid=Math.min(amount,interest);
  const principalPaid=Math.min(principal,Math.max(0,amount-interestPaid));
  payment.interestPaid=Math.round(interestPaid*100)/100;
  payment.principalPaid=Math.round(principalPaid*100)/100;
  interest=Math.max(0,Math.round((interest-interestPaid)*100)/100);
  principal=Math.max(0,Math.round((principal-principalPaid)*100)/100);
  last=when;
 }
 debt.principalAmount=principalBase;
 debt.principalRemaining=Math.round(principal*100)/100;
 debt.interestBalance=Math.round(interest*100)/100;
 debt.interestLastCalculatedAt=last.toISOString();
 debt.remaining=Math.round((debt.principalRemaining+debt.interestBalance)*100)/100;
 debt.status=debt.remaining<=0.01?'closed':'open';
 return {ok:true};
}
function markTransactionDeleted(id){
 if(id==null)return;
 data._denge_deleted=data._denge_deleted&&typeof data._denge_deleted==='object'?data._denge_deleted:{};
 data._denge_deleted.transactions=data._denge_deleted.transactions&&typeof data._denge_deleted.transactions==='object'?data._denge_deleted.transactions:{};
 data._denge_deleted.transactions[String(id)]=new Date().toISOString();
}
function debtOriginIds(debt){
 const ids=[];
 if(debt&&debt.openingTransactionId!=null)ids.push(String(debt.openingTransactionId));
 if(debt&&debt.id!=null){
  ids.push('tx-'+String(debt.id));
  ids.push(String(debt.id).replace(/^debt-/,''));

function findDebtOriginTransaction(debt){
 if(!debt)return null;

 if(debt.openingTransactionId){
  const exact=transactions.find(t=>String(t.id)===String(debt.openingTransactionId));
  if(exact)return exact;
 }
 const linked=transactions.find(t=>String(t.debtId||'')===String(debt.id)&&!isDebtPaymentTransaction(t));
 if(linked)return linked;
 const expected=debtDirectionOf(debt)==='payable'?'Borç Alındı':'Borç Verildi';
 const amount=Math.abs(Number(debt.principalAmount!==undefined?debt.principalAmount:debt.amount)||0);
 const created=String(debt.createdAt||'').slice(0,10);
 const matches=transactions.filter(t=>{
  if(t.type!=='debt'||isDebtPaymentTransaction(t)||t.debtId)return false;
  if(String(t.person||'').trim().toLocaleLowerCase('tr-TR')!==String(debt.person||'').trim().toLocaleLowerCase('tr-TR'))return false;
  const label=String(t.debtTypeLabel||t.name||'').toLocaleLowerCase('tr-TR');
  const directionMatch=debtDirectionOf(debt)==='payable'?(label.includes('alındı')||label.includes('aldım')):(label.includes('verildi')||label.includes('verdim'));
  if(!directionMatch||Math.abs(Number(t.amount)||0)!==amount)return false;
  return !created||String(t.date||'').slice(0,10)===created;
 });
 return matches.length===1?matches[0]:null;
}
function findDebtForTransaction(tx){
 if(!tx||tx.type!=='debt')return null;
 if(tx.debtId){
  const direct=(data.debts||[]).find(d=>String(d.id)===String(tx.debtId));
  if(direct)return direct;
 }
 const byOrigin=(data.debts||[]).find(d=>{const origin=findDebtOriginTransaction(d);return origin&&String(origin.id)===String(tx.id)});
 if(byOrigin)return byOrigin;
 if(isDebtPaymentTransaction(tx)){
  const personMatches=(data.debts||[]).filter(d=>String(d.person||'').trim().toLocaleLowerCase('tr-TR')===String(tx.person||'').trim().toLocaleLowerCase('tr-TR'));
  const exact=personMatches.filter(d=>(d.payments||[]).some(p=>String(p.date||'')===String(tx.date||'')&&Math.abs(Number(p.amount)||0)===Math.abs(Number(tx.amount)||0)));
  if(exact.length===1)return exact[0];
  const direction=tx.debtDirection||((String(tx.debtTypeLabel||'').toLocaleLowerCase('tr-TR').includes('tahsilat'))?'receivable':'payable');
  const byDirection=personMatches.filter(d=>debtDirectionOf(d)===direction);

function processGoalContributions(){

 const today=localDateISO(),ym=today.slice(0,7),day=Number(today.slice(8,10));let changed=false;
 data.goals.forEach(goal=>{
  const amount=Math.max(0,Number(goal.autoContributionAmount)||0);
  if(!amount||goal.autoContributionActive===false)return;
  if(!Array.isArray(goal.generatedMonths)){goal.generatedMonths=[];changed=true}
  if(goal.generatedMonths.includes(ym))return;
  const dueDay=Math.min(28,Math.max(1,Number(goal.autoContributionDay||1))),createdDay=String(goal.createdAt||today).slice(0,10);
  const dueDate=ym+'-'+String(dueDay).padStart(2,'0');
  if(createdDay>dueDate){goal.generatedMonths.push(ym);changed=true;return}
  if(day<dueDay)return;
  const target=Math.max(0,Number(goal.targetAmount||goal.target)||0),saved=Math.max(0,Number(goal.savedAmount??goal.saved??0));
  const contribution=Math.min(amount,Math.max(0,target-saved));
  if(contribution>0){
   goal.savedAmount=Math.round((saved+contribution)*100)/100;
   goal.contributions=Array.isArray(goal.contributions)?goal.contributions:[];
   goal.contributions.push({id:'goal-auto-'+goal.id+'-'+ym,amount:contribution,date:today,automatic:true});
  }
  goal.generatedMonths.push(ym);changed=true;
 });
 if(changed)save();
}

 (data.transactions||[]).forEach(t=>{

 });

 data.goals=Array.isArray(data.goals)?data.goals:[];

 }).filter(Boolean);

 +alertHtml

function moveCategory(type, fromIndex, toIndex){
  const list=data.categories[type]||[];
  if(fromIndex<0||toIndex<0||fromIndex>=list.length||toIndex>=list.length||fromIndex===toIndex) return;
  const item=list.splice(fromIndex,1)[0];
  list.splice(toIndex,0,item);
  data.categories[type]=list;
  save();
  render();
}
function bindCategoryReorder(){
  const type=window.catType||'expense';
  document.querySelectorAll('[data-cat-up]').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();const i=Number(b.dataset.catUp);if(!Number.isNaN(i))moveCategory(type,i,i-1)};
  });
  document.querySelectorAll('[data-cat-down]').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();const i=Number(b.dataset.catDown);if(!Number.isNaN(i))moveCategory(type,i,i+1)};
  });
  // Drag & drop reorder
  const listEl=document.getElementById('catList');
  if(!listEl) return;
  let dragIndex=null;
  listEl.querySelectorAll('.cat-row').forEach(row=>{
    row.draggable=true;
    row.ondragstart=e=>{
      dragIndex=Number(row.dataset.catIndex);
      row.classList.add('dragging');
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragIndex))}catch(_){}
    };
    row.ondragend=()=>{row.classList.remove('dragging');listEl.querySelectorAll('.cat-row').forEach(r=>r.classList.remove('drag-over'))};
    row.ondragover=e=>{e.preventDefault();row.classList.add('drag-over')};
    row.ondragleave=()=>row.classList.remove('drag-over');
    row.ondrop=e=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      const to=Number(row.dataset.catIndex);
      const from=dragIndex!=null?dragIndex:Number(e.dataTransfer.getData('text/plain'));
      if(!Number.isNaN(from)&&!Number.isNaN(to)) moveCategory(type,from,to);
      dragIndex=null;
    };
    // Touch long-press drag alternative: use up/down primarily on mobile
  });
}

function formatDateTR(iso){
  if(!iso) return '';

function openDateCalendar(inputEl,labelEl,options){
  if(!inputEl)return;
  const config=options||{};
  const cur=inputEl.value||localDateISO();
  const parts=cur.split('-').map(Number);
  let view=new Date(parts[0],parts[1]-1,1,12);
  let selected=cur;
  const monthsTR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const daysTR=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  const daysShort=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  const monthStart=()=>new Date(view.getFullYear(),view.getMonth(),1,12);
  const dateParts=iso=>{const p=String(iso||'').split('-').map(Number);return p.length===3&&p.every(Number.isFinite)?p:null};
  const buildGrid=()=>{
    const y=view.getFullYear(),m=view.getMonth();
    const first=new Date(y,m,1,12);
    const start=(first.getDay()+6)%7;
    const daysIn=new Date(y,m+1,0,12).getDate();
    const prevDays=new Date(y,m,0,12).getDate();
    let cells='';
    const todayIso=localDateISO();
    for(let i=0;i<42;i++){
      let day,cls='cal-day',iso;
      if(i<start){
        day=prevDays-start+i+1;
        cls+=' muted';
        iso=localDateISO(new Date(y,m-1,day,12));
      }else if(i>=start+daysIn){
        day=i-start-daysIn+1;
        cls+=' muted';
        iso=localDateISO(new Date(y,m+1,day,12));
      }else{
        day=i-start+1;
        iso=localDateISO(new Date(y,m,day,12));
      }
      if(iso===selected)cls+=' selected';
      if(iso===todayIso)cls+=' today';
      cells+='<button type="button" class="'+cls+'" data-iso="'+iso+'" aria-pressed="'+(iso===selected?'true':'false')+'">'+day+'</button>';
    }
    return cells;
  };
  const html='<div class="cal-modal" id="calModal" role="dialog" aria-modal="true" aria-label="Tarih seç">'+
    '<div class="cal-card"><div class="cal-header"><div class="cal-year" id="calYear"></div><div class="cal-big" id="calSelectedLabel"></div></div>'+
    '<div class="cal-nav"><button type="button" class="cal-nav-btn" id="calPrev" aria-label="Önceki ay">‹</button><span class="cal-month-label" id="calMonthLabel"></span><button type="button" class="cal-nav-btn" id="calNext" aria-label="Sonraki ay">›</button></div>'+
    '<div class="cal-weekdays">'+daysTR.map(d=>'<span>'+d+'</span>').join('')+'</div>'+
    '<div class="cal-grid" id="calGrid"></div>'+
    '<div class="cal-actions"><button type="button" class="cal-clear" id="calClear">Temizle</button><button type="button" class="cal-cancel" id="calCancel">İptal</button><button type="button" class="cal-ok" id="calOk">Ayarla</button></div></div></div>';
  document.getElementById('calModal')?.remove();
  document.body.insertAdjacentHTML('beforeend',html);
  const modal=document.getElementById('calModal');
  const grid=document.getElementById('calGrid');
  const yearLabel=document.getElementById('calYear');
  const selectedLabel=document.getElementById('calSelectedLabel');
  const monthLabel=document.getElementById('calMonthLabel');
  const previousOverflow=document.body.style.overflow;
  let closed=false;
  const dateLabel=iso=>{
    const p=dateParts(iso);
    if(!p)return '';
    const d=new Date(p[0],p[1]-1,p[2],12);
    return d.getDate()+' '+monthsTR[d.getMonth()].slice(0,3)+' '+daysShort[d.getDay()];
  };
  const refreshHeader=()=>{
    const p=dateParts(selected);
    const d=p?new Date(p[0],p[1]-1,p[2],12):new Date();
    yearLabel.textContent=String(view.getFullYear());
    selectedLabel.textContent=dateLabel(selected);
    monthLabel.textContent=monthsTR[view.getMonth()]+' '+view.getFullYear();
  };
  const refreshGrid=()=>{grid.innerHTML=buildGrid();};
  const refresh=()=>{refreshHeader();refreshGrid();};
  const close=()=>{
    if(closed)return;
    closed=true;
    modal.remove();
    document.body.style.overflow=previousOverflow;
  };
  const apply=()=>{
    if(closed)return;
    inputEl.value=selected;
    inputEl.setAttribute('value',selected);
    if(labelEl)labelEl.textContent=selected?formatDateTR(selected):(config.placeholder||'Tarih seç');
    try{
      inputEl.dispatchEvent(new Event('input',{bubbles:true}));
      inputEl.dispatchEvent(new Event('change',{bubbles:true}));
    }catch(_){}
    close();
  };
  document.body.style.overflow='hidden';
  refresh();
  const handleAction=e=>{
    const button=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!button){
      if(e.target===modal){e.preventDefault();e.stopPropagation();close();}
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    if(button.dataset.iso){
      selected=button.dataset.iso;
      const p=dateParts(selected);
      if(p&&(button.classList.contains('muted')||p[0]!==view.getFullYear()||p[1]-1!==view.getMonth())){
        view=new Date(p[0],p[1]-1,1,12);
        refresh();
      }else{
        grid.querySelectorAll('.cal-day.selected').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});
        button.classList.add('selected');
        button.setAttribute('aria-pressed','true');
        refreshHeader();
      }
      return;
    }
    if(button.id==='calPrev'){view=new Date(view.getFullYear(),view.getMonth()-1,1,12);refresh();return;}
    if(button.id==='calNext'){view=new Date(view.getFullYear(),view.getMonth()+1,1,12);refresh();return;}
    if(button.id==='calClear'){
      selected=config.allowEmpty?'':localDateISO();
      view=monthStart();
      apply();
      return;
    }
    if(button.id==='calCancel'){close();return;}
    if(button.id==='calOk'){apply();return;}
  };
  modal.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    handleAction(e);
  });
  modal.addEventListener('contextmenu',e=>e.preventDefault());
}

function openPhotoCropEditor(sourceImg,onDone){
 document.getElementById('photoCropModal')?.remove();
 const html='<div class="photo-crop-modal" id="photoCropModal"><div class="photo-crop-card"><div class="crop-head"><h3>Fotoğrafı ayarla</h3><p>Sürükle ve yakınlaştır, ardından uygula.</p></div><div class="crop-stage" id="cropStage"><canvas id="cropCanvas"></canvas><div class="crop-ring" aria-hidden="true"></div></div><div class="crop-zoom-row"><span class="crop-zoom-ico">−</span><input type="range" id="cropZoom" min="100" max="300" value="100" step="1" aria-label="Yakınlaştır"><span class="crop-zoom-ico">+</span></div><div class="crop-actions"><button type="button" class="crop-btn ghost" id="cropCancel">Vazgeç</button><button type="button" class="crop-btn primary" id="cropApply">Uygula</button></div></div></div>';
 document.body.insertAdjacentHTML('beforeend',html);
 const modal=document.getElementById('photoCropModal');
 const stage=document.getElementById('cropStage');
 const canvas=document.getElementById('cropCanvas');
 const zoomEl=document.getElementById('cropZoom');
 const ctx=canvas.getContext('2d');
 const size=Math.min(280, Math.floor((Math.min(window.innerWidth||360,400)-48)));
 canvas.width=size; canvas.height=size;
 stage.style.width=size+'px'; stage.style.height=size+'px';
 const iw=sourceImg.naturalWidth||sourceImg.width, ih=sourceImg.naturalHeight||sourceImg.height;
 // cover scale at zoom=1
 const baseCover=Math.max(size/iw, size/ih);
 let zoom=1, ox=0, oy=0;
 let dragging=false, lastX=0, lastY=0;
 const draw=()=>{
   const s=baseCover*zoom;
   const dw=iw*s, dh=ih*s;
   // clamp offsets so image always covers circle area
   const maxOx=Math.max(0,(dw-size)/2), maxOy=Math.max(0,(dh-size)/2);
   ox=Math.max(-maxOx, Math.min(maxOx, ox));
   oy=Math.max(-maxOy, Math.min(maxOy, oy));
   ctx.clearRect(0,0,size,size);
   ctx.save();
   ctx.beginPath();
   ctx.arc(size/2,size/2,size/2,0,Math.PI*2);
   ctx.closePath();
   ctx.clip();
   ctx.fillStyle='#1a1c28';
   ctx.fillRect(0,0,size,size);
   ctx.drawImage(sourceImg, size/2-dw/2+ox, size/2-dh/2+oy, dw, dh);
   ctx.restore();
 };
 draw();
 zoomEl.oninput=()=>{zoom=Number(zoomEl.value)/100;draw()};
 const onDown=(x,y)=>{dragging=true;lastX=x;lastY=y};
 const onMove=(x,y)=>{if(!dragging)return;ox+=x-lastX;oy+=y-lastY;lastX=x;lastY=y;draw()};
 const onUp=()=>{dragging=false};
 canvas.addEventListener('mousedown',e=>{e.preventDefault();onDown(e.clientX,e.clientY)});
 window.addEventListener('mousemove',e=>{if(dragging)onMove(e.clientX,e.clientY)});
 window.addEventListener('mouseup',onUp);
 canvas.addEventListener('touchstart',e=>{if(!e.touches[0])return;e.preventDefault();onDown(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
 canvas.addEventListener('touchmove',e=>{if(!e.touches[0])return;e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
 canvas.addEventListener('touchend',onUp);
 canvas.addEventListener('touchcancel',onUp);
 // pinch zoom
 let pinchDist=0;
 stage.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinchDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}},{passive:true});
 stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchDist){const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const factor=d/pinchDist;pinchDist=d;zoom=Math.max(1,Math.min(3,zoom*factor));zoomEl.value=String(Math.round(zoom*100));draw()}},{passive:true});
 document.getElementById('cropCancel').onclick=()=>modal.remove();
 document.getElementById('cropApply').onclick=()=>{
   // export high-res circle crop to square jpeg
   const out=document.createElement('canvas');
   const OUT=512; out.width=OUT; out.height=OUT;
   const octx=out.getContext('2d');
   const s=baseCover*zoom*(OUT/size);
   const dw=iw*s, dh=ih*s;
   const ox2=ox*(OUT/size), oy2=oy*(OUT/size);
   octx.fillStyle='#1a1c28';
   octx.fillRect(0,0,OUT,OUT);
   octx.drawImage(sourceImg, OUT/2-dw/2+ox2, OUT/2-dh/2+oy2, dw, dh);
   const dataUrl=out.toDataURL('image/jpeg',0.9);
   data.settings.profilePhoto=dataUrl;
   save();
   modal.remove();
   if(typeof onDone==='function') onDone(dataUrl);
 };
 modal.onclick=e=>{if(e.target===modal)modal.remove()};
}

function recurringNextPaymentInfo(record){
 const now=new Date();
 const day=normalizeRecurringDay(record&&record.dayOfMonth,1);
 const monthKey=String(now.getFullYear())+'-'+String(now.getMonth()+1).padStart(2,'0');
 const createdThisMonth=(data.transactions||[]).some(t=>String(t.recurringId)===String(record.id)&&String(t.date||'').slice(0,7)===monthKey);
 let due=recurringDateForMonth(now.getFullYear(),now.getMonth(),day);
 if(createdThisMonth||now.getDate()>due.getDate()) due=recurringDateForMonth(now.getFullYear(),now.getMonth()+1,day);
 const todayUtc=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
 const dueUtc=Date.UTC(due.getFullYear(),due.getMonth(),due.getDate());
 const days=Math.max(0,Math.round((dueUtc-todayUtc)/86400000));
 const countdown=days===0?'Bugün':days===1?'Yarın':days+' gün kaldı';
 const dateLabel=due.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
 return {dateLabel,countdown,days};
}

async function deleteTransactionAndSync(id){
 const deletedTx=(data.transactions||[]).find(item=>String(item.id)===String(id));
 if(!deletedTx)return;
 const debt=deletedTx.type==='debt'?findDebtForTransaction(deletedTx):null;
 if(debt){
  const isOrigin=String(debt.openingTransactionId||'')===String(deletedTx.id)||!isDebtPaymentTransaction(deletedTx);
  if(isOrigin){
   const origin=findDebtOriginTransaction(debt);
   const personKey=String(debt.person||'').trim().toLocaleLowerCase('tr-TR');
   const linked=(data.transactions||[]).filter(tx=>String(tx.debtId||'')===String(debt.id)||origin&&String(tx.id)===String(origin.id)||!tx.debtId&&tx.type==='debt'&&String(tx.person||'').trim().toLocaleLowerCase('tr-TR')===personKey&&isDebtPaymentTransaction(tx));
   linked.forEach(t=>markTransactionDeleted(t.id));
   debtOriginIds(debt).forEach(markTransactionDeleted);
   data.transactions=(data.transactions||[]).filter(tx=>!linked.some(t=>String(t.id)===String(tx.id)));
   data.debts=(data.debts||[]).filter(item=>String(item.id)!==String(debt.id));
   data.reminders=(data.reminders||[]).filter(reminder=>String(reminder.id)!=='debt-due-'+String(debt.id));
  }else{
   const paymentId=String(deletedTx.debtPaymentId||'');
   const payments=Array.isArray(debt.payments)?debt.payments:[];
   let index=paymentId?payments.findIndex(payment=>String(payment.id)===paymentId):-1;
   if(index<0){
    index=payments.findIndex(payment=>String(payment.date||'')===String(deletedTx.date||'')&&Math.abs(Number(payment.amount)||0)===Math.abs(Number(deletedTx.amount)||0));
   }
   if(index>=0)payments.splice(index,1);
   else{
    // Legacy quick repayments did not store a payment array; reverse their
    // principal reduction so removing the movement restores the outstanding debt.
    const amount=Math.abs(Number(deletedTx.amount)||0);
    const principalBase=Math.max(0,Number(debt.principalAmount!==undefined?debt.principalAmount:debt.amount)||0);
    const principalNow=debtPrincipalRemaining(debt);
    debt.principalRemaining=Math.min(principalBase,principalNow+amount);
    debt.remaining=Math.max(debt.principalRemaining,Number(debt.remaining||0)+amount);
   }
   debt.payments=payments;
   const recalculated=payments.length||Number(debt.interestRateMonthly)>0?recalculateDebtLedger(debt):{ok:true};
   if(!recalculated.ok){showAlertCard('Ödeme silindi ancak borç bakiyesi yeniden hesaplanamadı. Kayıt korunuyor.','Borç kaydı kontrol edilmeli','error');return}
   syncDebtReminder(debt);
   markTransactionDeleted(deletedTx.id);
   data.transactions=(data.transactions||[]).filter(item=>String(item.id)!==String(id));
  }
 }else{
  if(deletedTx.recurringId!=null){
   const month=String(deletedTx.date||'').slice(0,7);
   const recurring=(data.recurring||[]).find(r=>String(r.id)===String(deletedTx.recurringId));
   if(recurring&&month.length===7&&month[4]==='-'){
    if(!Array.isArray(recurring.generatedMonths))recurring.generatedMonths=[];
    if(!recurring.generatedMonths.includes(month))recurring.generatedMonths.push(month);
   }
  }
  markTransactionDeleted(id);
  data.transactions=(data.transactions||[]).filter(item=>String(item.id)!==String(id));
 }
 save();render();
 const cloud=window.DengeCloud&&window.DengeCloud.getStatus?window.DengeCloud.getStatus():null;
 if(!cloud||!cloud.userId){toast(appText('İşlem cihazdan silindi. Cloud eşitlemesi için giriş yapmalısın.'));return}
 if(!navigator.onLine){toast(appText('İşlem cihazdan silindi. İnternet gelince Cloud ile eşitlenecek.'));return}
 try{
  await window.DengeCloud.syncNow();updateCloudPanel();
  toast(appText(debt&&String(deletedTx.id)!==String(debt.openingTransactionId)?'Ödeme silindi, borç bakiyesi güncellendi.':'İşlem silindi ve Denge Cloud ile eşitlendi.'));
 }catch(error){
  updateCloudPanel();
  const detail=window.DengeCloud&&window.DengeCloud.getLocalizedError?window.DengeCloud.getLocalizedError(error):(error&&error.message?error.message:'');
  showAlertCard(appText('İşlem silindi ancak Cloud eşitlemesi tamamlanamadı.')+(detail?' '+detail:''),'Denge Cloud','error');
 }
}

 const html='<div class="settings-modal" id="goalModal"><div class="settings-modal-card goal-modal-card"><div class="picker-title"><span class="picker-modal-icon">'+sicon('target')+'</span><div><h3>Finansal hedef ekle</h3><p>Hedefini belirle, düzenli katkı planla.</p></div></div><div class="goal-fields"><div class="goal-field"><label>Hedef adı</label><input id="goalName" maxlength="70" placeholder="Örn. Yeni telefon"></div><div class="goal-field"><label>Hedef tutarı</label><input id="goalTarget" inputmode="decimal" placeholder="2.000"></div><div class="goal-field"><label>Mevcut birikim</label><input id="goalSaved" inputmode="decimal" placeholder="0"></div><div class="goal-field"><label>Hedef tarihi</label><input id="goalDate" type="date"></div><div class="goal-field"><label>Otomatik aylık katkı (isteğe bağlı)</label><input id="goalAutoAmount" inputmode="decimal" placeholder="0"></div><div class="goal-field"><label>Her ay hangi gün katkı işlensin?</label><input id="goalAutoDay" type="number" min="1" max="28" value="1"></div></div><div class="goal-actions"><button type="button" class="goal-cancel" id="goalCancel">Vazgeç</button><button type="button" class="goal-primary" id="goalSave">Hedefi Kaydet</button></div></div></div>';
 document.body.insertAdjacentHTML('beforeend',html);const m=document.getElementById('goalModal');

 document.getElementById('goalSave').onclick=()=>{

 };m.onclick=e=>{if(e.target===m)m.remove()};

function showGoalContributionModal(goalId){
 const goal=(data.goals||[]).find(g=>String(g.id)===String(goalId));if(!goal)return;
 const html='<div class="settings-modal" id="goalContributionModal"><div class="settings-modal-card goal-modal-card"><h3>Hedefe katkı yap</h3><p>'+esc(goal.name||'Finansal hedef')+' için ek katkı tutarını gir.</p><div class="goal-fields"><div class="goal-field"><label>Katkı tutarı</label><input id="goalContributionAmount" inputmode="decimal" placeholder="0"></div></div><div class="goal-actions"><button class="goal-cancel" id="goalContributionCancel">Vazgeç</button><button class="goal-primary" id="goalContributionSave">Katkıyı ekle</button></div></div></div>';
 document.body.insertAdjacentHTML('beforeend',html);const m=document.getElementById('goalContributionModal');
 document.getElementById('goalContributionCancel').onclick=()=>m.remove();
 document.getElementById('goalContributionSave').onclick=()=>{
  const amount=Number(String(document.getElementById('goalContributionAmount').value||'').replace(',','.'));
  if(!Number.isFinite(amount)||amount<=0){showAlertCard('Geçerli bir katkı tutarı girin.','Katkı eklenemedi','error');return}
  const target=Math.max(0,Number(goal.targetAmount||goal.target)||0),saved=Math.max(0,Number(goal.savedAmount??goal.saved??0)),applied=Math.min(amount,Math.max(0,target-saved));
  if(applied<=0){showAlertCard('Bu hedef zaten tamamlanmış.','Hedef tamamlandı','info');return}
  goal.savedAmount=Math.round((saved+applied)*100)/100;goal.contributions=Array.isArray(goal.contributions)?goal.contributions:[];
  goal.contributions.push({id:'goal-manual-'+Date.now(),amount:applied,date:localDateISO(),automatic:false});

 };m.onclick=e=>{if(e.target===m)m.remove()};
}

// Mobile pull-to-refresh: only starts at the top of the page and never inside forms/modals.
(function(){
 const isMobile=()=>window.matchMedia&&window.matchMedia('(max-width: 699px)').matches;
 const indicator=document.createElement('div');
 indicator.className='mobile-refresh-indicator';
 indicator.setAttribute('role','status');
 indicator.setAttribute('aria-live','polite');
 indicator.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6"/><path d="M18.4 15A7 7 0 0 1 6 18l-2-6"/></svg><span>Yenilemek için aşağı çek</span>';
 document.body.appendChild(indicator);
 let startY=0,startX=0,pull=0,tracking=false;
 const threshold=92,maxPull=126;
 const scrollTop=()=>window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;
 const blocked=target=>!!(target&&target.closest&&target.closest('input,textarea,select,button,a,[contenteditable="true"],.add-page,.cal-modal,[role="dialog"],.modal,.sheet,.picker-modal'));
 const reset=()=>{tracking=false;pull=0;indicator.classList.remove('visible','refreshing');indicator.style.transform='translate(-50%,-150%)';};
 document.addEventListener('touchstart',e=>{
   if(!isMobile()||e.touches.length!==1||scrollTop()>2||blocked(e.target))return;
   startY=e.touches[0].clientY;startX=e.touches[0].clientX;pull=0;tracking=true;
 },{passive:true});
 document.addEventListener('touchmove',e=>{
   if(!tracking||e.touches.length!==1)return;
   const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
   if(dy<0||Math.abs(dx)>Math.abs(dy)*.8){if(Math.abs(dx)>18||dy<0)reset();return;}
   if(scrollTop()>2){reset();return;}
   pull=Math.min(maxPull,dy*.58);
   if(dy>8){indicator.classList.add('visible');indicator.style.transform='translate(-50%,'+Math.max(0,pull-54)+'px)';}
   const label=indicator.querySelector('span');
   if(label)label.textContent=pull>=threshold*.58?'Bırakarak yenile':'Yenilemek için aşağı çek';
 },{passive:true});
 document.addEventListener('touchend',()=>{
   if(!tracking)return;
   const shouldRefresh=pull>=threshold*.58;
   if(shouldRefresh){
     tracking=false;indicator.classList.add('visible','refreshing');
     indicator.style.transform='translate(-50%,8px)';
     const label=indicator.querySelector('span');if(label)label.textContent='Sayfa yenileniyor…';
     setTimeout(()=>location.reload(),120);
   }else reset();
 },{passive:true});
 document.addEventListener('touchcancel',reset,{passive:true});
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./service-worker.js').then(reg=>reg.update()).catch(e=>console.warn('Çevrimdışı önbellek güncellenemedi:',e));}
if(data.settings.security&&data.settings.pin){window.__pinBootDone=true;appLocked=true;setTimeout(()=>{window.__pinBootDone=false;showPinUnlock()},80)}
document.addEventListener('visibilitychange',()=>{const active=document.activeElement;const editingAddForm=page==='add'&&!!(active&&active.closest&&active.closest('.add-page')&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName));if(document.visibilityState==='hidden'&&data.settings.security&&!editingAddForm){appLocked=true;setPinGateVisible(true)}if(document.visibilityState==='visible'&&data.settings.security&&appLocked&&!editingAddForm){setPinGateVisible(true);setTimeout(showPinUnlock,80)}});
})();
