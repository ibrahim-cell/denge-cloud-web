<script>
(function(){
const KEY='denge-v3';
const initial={transactions:[],accounts:[{id:1,name:'Nakit',balance:0},{id:2,name:'Banka',balance:0},{id:3,name:'Kredi Kartı',balance:0}],categories:{income:['Maaş','Ek Gelir','Yatırım','Freelance','Diğer'],expense:['Market','Fatura','Ulaşım','Yemek','Alışveriş','Eğlence','Sağlık','Diğer']},budgets:{},settings:{theme:'Açık',notifications:true,currency:'TRY',security:false,pin:'',profileName:'',profilePhoto:''},debts:[],goals:[],recurring:[]};
let data;try{let stored=localStorage.getItem(KEY);if(!stored&&window.AndroidBridge&&typeof AndroidBridge.consumeLegacyData==='function'){const legacy=AndroidBridge.consumeLegacyData();if(legacy){try{JSON.parse(legacy);localStorage.setItem(KEY,legacy);stored=legacy}catch(_){}}}data=stored?JSON.parse(stored):initial}catch(e){data=initial}data.settings=Object.assign({theme:'Açık',notifications:true,currency:'TRY',security:false,pin:'',profileName:'',profilePhoto:''},data.settings||{});data.categories=data.categories||{income:[],expense:[]};data.categoryIcons=data.categoryIcons||{};
// Geçersiz işlem tiplerini ve eski migration meta verisini temizle; borç/alacak korunur.
if(Array.isArray(data.transactions)){data.transactions=data.transactions.filter(t=>t&&(['income','expense','transfer','debt'].includes(t.type)));}
if(!Array.isArray(data.debts)) data.debts=[];
if(!Array.isArray(data.recurring)) data.recurring=[];
if(!Array.isArray(data.goals)) data.goals=[];
delete data.migration;
data.accounts=(data.accounts||[]).filter(a=>String(a?.name||'').trim().toLowerCase()!=='hesap belirtilmemiş');
(data.accounts||[]).forEach(a=>{if(a.openingBalance===undefined)a.openingBalance=0;if(a.balance===undefined)a.balance=0;});
save();
const currentMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
try{processRecurring()}catch(e){}
let page='home',hide=false,q='',filter='all',searchOpen=false,analysisMonth=currentMonth(),analysisMode='expense',budgetMonth=currentMonth();
const money=n=>{const v=Number(n)||0;const hasFrac=Math.abs(v%1)>1e-9;return new Intl.NumberFormat('tr-TR',{style:'currency',currency:data?.settings?.currency||'TRY',minimumFractionDigits:hasFrac?2:0,maximumFractionDigits:2}).format(v)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATEGORY_ICON_MAP={
'Market':'market','Fatura':'invoice','Ulaşım':'transport','Yemek':'food','Alışveriş':'shopping',
'Eğlence':'game','Sağlık':'health','Diğer':'dots','Kira':'home','Maaş':'wallet','Ek Gelir':'trendUp',
'Yatırım':'chart','Freelance':'edit','Yakıt':'fuel','Eczane':'pharmacy','Kahve':'coffee',
'Bakım':'tool','Yıkama':'carwash','Trafik cezası':'ticket','Kredi':'card','Banka':'bank',
'Çamaşır':'home','Giyim':'shopping','Abonelik':'invoice','Eğitim':'invoice','Hediye':'heart',
'Spor':'heart','Pet':'heart','Teknoloji':'monitor','Seyahat':'transport','Vergi':'invoice',
'Prim':'wallet','Bonus':'trendUp','Kira Geliri':'home','Faiz':'chart','Komisyon':'currency'
};
const FALLBACK_ICONS=['tag','home','shopping','food','transport','game','health','wallet','chart','coffee','card','bank','invoice','tool','heart','currency'];
function getCategoryIconKey(name){
  const n=String(name||'').trim();
  if(!n) return 'tag';
  if(data.categoryIcons&&data.categoryIcons[n]) return data.categoryIcons[n];
  if(CATEGORY_ICON_MAP[n]) return CATEGORY_ICON_MAP[n];
  // deterministic fallback from name (not always dots)
  let h=0; for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0;
  return FALLBACK_ICONS[h%FALLBACK_ICONS.length];
}
function getCategoryIcon(name){return sicon(getCategoryIconKey(name))}
function icoIcon(k){return getCategoryIcon(k);} // legacy helper
function save(){localStorage.setItem(KEY,JSON.stringify(data));try{if(window.DengeCloud&&typeof window.DengeCloud.localSave==='function')window.DengeCloud.localSave(data)}catch(e){console.warn('Denge Cloud kuyruğu güncellenemedi:',e)}}
function cloneDengeData(value){return JSON.parse(JSON.stringify(value==null?{}:value))}
window.__dengeCloudBridge={
 getData:()=>data,
 defaultData:()=>cloneDengeData(initial),
 setData:(incoming,options)=>{
  const opts=options||{},currentSettings=data&&data.settings?data.settings:{};
  const next=cloneDengeData(incoming||{});
  next.settings=Object.assign({theme:'Açık',notifications:true,currency:'TRY',security:false,pin:'',profileName:'',profilePhoto:''},next.settings||{});
  if(opts.preserveDeviceSettings!==false){next.settings.security=!!currentSettings.security;next.settings.pin=currentSettings.pin||'';next.settings.profilePhoto=currentSettings.profilePhoto||'';}
  else if(opts.deviceSettings){next.settings.security=!!opts.deviceSettings.security;next.settings.pin=opts.deviceSettings.pin||'';next.settings.profilePhoto=opts.deviceSettings.profilePhoto||'';}
  next.transactions=Array.isArray(next.transactions)?next.transactions:[];
  next.debts=Array.isArray(next.debts)?next.debts:[];
  next.goals=Array.isArray(next.goals)?next.goals:[];
  next.recurring=Array.isArray(next.recurring)?next.recurring:[];
  next.accounts=Array.isArray(next.accounts)?next.accounts:cloneDengeData(initial.accounts);
  next.categories=next.categories||cloneDengeData(initial.categories);
  next.budgets=next.budgets||{};
  next.categoryIcons=next.categoryIcons||{};
  data=next;localStorage.setItem(KEY,JSON.stringify(data));
  if(typeof render==='function')render();
 }
};
/* PIN security helpers — SHA-256 hash, never store plain PIN */
const PIN_SALT='denge-pin-v1';
async function hashPin(pin){
  const enc=new TextEncoder();
  const buf=await crypto.subtle.digest('SHA-256',enc.encode(PIN_SALT+':'+String(pin||'')));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isPlainPin(v){return typeof v==='string'&&/^\d{4}$/.test(v)}
async function verifyPin(input){
  const stored=data.settings.pin||'';
  if(!stored) return false;
  if(isPlainPin(stored)){
    // migrate legacy plain PIN on successful match
    if(input===stored){data.settings.pin=await hashPin(input);save();return true}
    return false;
  }
  const h=await hashPin(input);
  return h===stored;
}
function emptyState(icon,title,desc,ctaLabel,ctaAttr){
  return '<div class="empty-state"><div class="empty-ico">'+sicon(icon||'wallet')+'</div><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p>'
    +(ctaLabel?'<button type="button" class="empty-cta" '+ctaAttr+'>'+esc(ctaLabel)+'</button>':'')+'</div>';
}
function processRecurring(){
  data.recurring=Array.isArray(data.recurring)?data.recurring:[];
  if(!data.recurring.length) return;
  const ym=currentMonth();
  const day=new Date().getDate();
  let changed=false;
  data.recurring.forEach(r=>{
    if(r&&r.active===false) return;
    const rDay=Math.min(28,Math.max(1,Number(r.dayOfMonth||1)));
    if(day<rDay) return;
    const already=data.transactions.some(t=>t.recurringId===r.id&&String(t.date||'').slice(0,7)===ym);
    if(already) return;
    const id=Date.now()+Math.random();
    const amt=Number(r.amount)||0;
    const signed=r.type==='income'?Math.abs(amt):-Math.abs(amt);
    const date=ym+'-'+String(rDay).padStart(2,'0');
    data.transactions.unshift({
      id,type:r.type==='income'?'income':'expense',
      name:(r.name||'Tekrarlayan')+' \u21bb',
      category:r.category||'Diğer',
      amount:signed,date,time:'00:00',
      account:r.account||((data.accounts||[])[0]||{}).name||'',
      recurringId:r.id
    });
    changed=true;
  });
  if(changed) save();
}

function isRealAccount(name){return String(name||'').trim()!==''&&String(name||'').trim().toLowerCase()!=='hesap belirtilmemiş'}
function computedAccountBalances(){
 const out={};
 (data.accounts||[]).forEach(a=>{const name=String(a.name||'');out[name]=Number(a.openingBalance!==undefined?a.openingBalance:((data.migration&&data.migration.sourceApp)?0:Number(a.balance||0)))||0});
 (data.transactions||[]).forEach(t=>{
   const type=t.type||((t.sourceType||'').toLowerCase()==='transfer'?'transfer':'');
   if(type==='transfer'){
     const amt=Math.abs(Number(t.transferAmount!==undefined?t.transferAmount:t.amount||0));
     const from=String(t.fromAccount||''); const to=String(t.toAccount||'');
     if(from&&out[from]!==undefined) out[from]-=amt;
     if(to&&out[to]!==undefined) out[to]+=amt;
     return;
   }
   const account=String(t.account||'');
   if(account&&out[account]!==undefined) out[account]+=Number(t.amount||0);
 });
 return out;
}
function totalRealAccountBalance(){const balances=computedAccountBalances();return (data.accounts||[]).reduce((sum,a)=>isRealAccount(a.name)?sum+Number(balances[a.name]||0):sum,0)}

function sanitizeDengeData(src){
 const baseSettings={theme:'Açık',notifications:true,currency:'TRY',security:false,pin:'',profileName:'',profilePhoto:''};
 const sourceIsFix=src&&src.app==='Fix Finans'&&Array.isArray(src.transactions)&&(!src.accounts);
 let tx=[];
 if(sourceIsFix){
   tx=src.transactions.filter(x=>Array.isArray(x)&&['Gelir','Gider','Transfer'].includes(String(x[4]||''))).map((x,i)=>{
     const kind=String(x[4]||'');
     const date=String(x[6]||'');
     const iso=String(x[8]||'');
     const time=/T(\d{2}:\d{2})/.exec(iso)?.[1]||'';
     if(kind==='Transfer'){
       const transferFrom=String(x[8]||'');
       const transferTo=String(x[9]||'');
       const amount=Math.abs(Number(x[10]||0))||0;
       return {id:'fix-import-'+i,type:'transfer',name:String(x[5]||'Transfer').trim()||'Transfer',category:'Transfer',amount:0,transferAmount:amount,date,time,account:transferTo,fromAccount:transferFrom,toAccount:transferTo};
     }
     const account=['Nakit','Banka','Kredi Kartı'].includes(String(x[7]||''))?String(x[7]):'';
     return {id:'fix-import-'+i,type:kind==='Gelir'?'income':'expense',name:String(x[5]||x[0]||'İşlem').trim()||'İşlem',category:String(x[0]||'Diğer'),amount:Number(x[1])||0,date,time,account};
   });
 }else{
   tx=(Array.isArray(src.transactions)?src.transactions:[]).filter(t=>{const type=t&&t.type;return type==='income'||type==='expense'||type==='transfer'||type==='debt';}).map(t=>{
     const x=Object.assign({},t);
     if(x.type==='transfer'){x.amount=0;x.transferAmount=Math.abs(Number(x.transferAmount!==undefined?x.transferAmount:0))||0;}
     else{x.amount=Number(x.amount)||0;}
     if(String(x.account||'').trim().toLowerCase()==='hesap belirtilmemiş')x.account='';
     return x;
   });
 }
 const accounts=[];
 const rawAccounts=Array.isArray(src.accounts)?src.accounts:[];
 rawAccounts.forEach(a=>{
   const name=String(a&&a.name||'').trim();
   if(!name||name.toLowerCase()==='hesap belirtilmemiş')return;
   if(!accounts.some(x=>x.name===name))accounts.push({id:a.id||Date.now()+Math.random(),name,openingBalance:Number(a.openingBalance)||0,balance:0});
 });
 ['Nakit','Banka','Kredi Kartı'].forEach((name,i)=>{if(!accounts.some(a=>a.name===name))accounts.splice(i,0,{id:i+1,name,openingBalance:0,balance:0});});
 return {transactions:tx,accounts,categories:{income:Array.isArray(src.categories?.income)?src.categories.income:(sourceIsFix?['Maaş','Ek Gelir','Yatırım','Freelance','Diğer']:[]),expense:Array.isArray(src.categories?.expense)?src.categories.expense:(sourceIsFix?['Market','Fatura','Ulaşım','Yemek','Alışveriş','Eğlence','Sağlık','Diğer']:[])},budgets:src.budgets||{},settings:Object.assign(baseSettings,src.settings||{}),debts:Array.isArray(src.debts)?src.debts:[],goals:Array.isArray(src.goals)?src.goals:[],recurring:Array.isArray(src.recurring)?src.recurring:[]};
}
function __applyImportedBackup(raw){try{
 const imported=typeof raw==='string'?JSON.parse(raw):raw;
 const validFix=imported&&imported.app==='Fix Finans'&&Array.isArray(imported.transactions);
 const validDenge=imported&&Array.isArray(imported.transactions)&&Array.isArray(imported.accounts)&&imported.categories&&Array.isArray(imported.categories.income)&&Array.isArray(imported.categories.expense);
 if(!validFix&&!validDenge)throw new Error('Geçersiz yedek');
 data=sanitizeDengeData(imported);save();applyTheme();showAlertCard('Yedek yüklendi. Gelir, gider, transfer ve borç/alacak kayıtları aktarıldı.','Yedek başarıyla yüklendi','success');render();return true;
 }catch(e){showAlertCard('Yedek dosyası geçersiz.','Yedek yüklenemedi','error');return false}}
window.__dengeRestoreFromText=__applyImportedBackup;
function nav(p){page=p;render();scrollTo(0,0)}
function txRow(t,del=false){const isTransfer=t.type==='transfer',isDebt=t.type==='debt';const cls=isTransfer?'transfer':isDebt?'debt':(t.amount>0?'income':'expense');const icon=isTransfer?'⇄':isDebt?'₺':getCategoryIcon(t.category);const meta=isTransfer?(esc(t.fromAccount||'')+' → '+esc(t.toAccount||'')):(isDebt?(esc(t.person||'')+' · '+esc(t.debtTypeLabel||'Borç/Alacak')):(esc(t.category||'')+' · '+esc(t.time||'')));const amountLabel=isTransfer?money(t.transferAmount||0):money(Math.abs(Number(t.amount)||0));return '<div class="tx-action"><div class="txrow '+cls+'" data-detail="'+esc(String(t.id))+'"><div class="caticon">'+icon+'</div><div class="txmain"><b>'+esc(t.name||t.category||'Transfer')+'</b><span>'+meta+'</span></div><strong class="'+cls+'">'+(isTransfer?'':(t.amount>0?'+':'-'))+amountLabel+'</strong></div></div>'}

function analysis(){
 const ym=/^\d{4}-\d{2}$/.test(analysisMonth)?analysisMonth:'2026-09';
 const monthTx=data.transactions.filter(t=>String(t.date||'').slice(0,7)===ym);
 const income=monthTx.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
 const expense=-monthTx.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0);
 const net=income-expense;
 const total=analysisMode==='income'?income:analysisMode==='net'?Math.abs(net):expense;
 const selectedTx=analysisMode==='income'?monthTx.filter(t=>t.amount>0):monthTx.filter(t=>t.amount<0);
 const by={}; selectedTx.forEach(t=>{const k=t.category||'Diğer';by[k]=(by[k]||0)+Math.abs(t.amount)});
 const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const palette=['#6d5dfc','#ef6b77','#55c7a0','#f1b55b','#7b9cf5','#d48bdc','#6bc4d4'];
 let angle=0; const parts=ent.map(([k,v],i)=>{const deg=total?v/total*360:0;const part=palette[i%palette.length]+' '+angle+'deg '+(angle+deg)+'deg';angle+=deg;return part});
 const gradient=parts.length?'conic-gradient('+parts.join(',')+')':'conic-gradient(#e9e7ff 0 360deg)';
 const pct=income?Math.round(expense/income*100):0;
 const months=Array.from({length:12},(_,i)=>ym.slice(0,4)+'-'+String(i+1).padStart(2,'0'));
 if(!months.includes(ym))months.unshift(ym);
 const monthName=x=>{const [y,m]=x.split('-');return new Intl.DateTimeFormat('tr-TR',{month:'long',year:'numeric'}).format(new Date(Number(y),Number(m)-1,1));};
 const modeLabel=analysisMode==='income'?'Toplam Gelir':analysisMode==='net'?'Net':'Toplam Gider';
 const amountClass=analysisMode==='income'?'income':analysisMode==='expense'?'expense':'';
 const legendTotal=total||1;
 return '<div class="analysis-page">'
 +' <div class="analysis-top"><button class="analysis-back" data-nav="home" aria-label="Geri">‹</button><h1>Analiz</h1></div>'

 +' <div class="analysis-tabs"><button class="'+(analysisMode==='income'?'active':'')+'" data-analysis-mode="income">Gelir</button><button class="'+(analysisMode==='expense'?'active':'')+'" data-analysis-mode="expense">Gider</button><button class="'+(analysisMode==='net'?'active':'')+'" data-analysis-mode="net">Net</button></div>'
 +' <section class="card analysis-main-card"><div class="analysis-card-head"><span>'+modeLabel+'</span><strong class="'+amountClass+'">'+money(total)+'</strong></div>'
 +' <div class="analysis-card-body"><div class="analysis-donut" style="background:'+gradient+'"><div class="analysis-donut-inner"><b>'+pct+'%</b><span>harcama</span></div></div>'
 +' <div class="analysis-legend">'+(ent.length?ent.map(([k,v],i)=>'<div class="analysis-legend-row"><i class="analysis-dot" style="background:'+palette[i%palette.length]+'"></i><span>'+esc(k)+'</span><b>'+Math.round(v/legendTotal*100)+'%</b></div>').join(''):'<div class="muted">Bu ay işlem yok</div>')+'</div></div></section>'
 +' <div class="analysis-section-title">En çok harcananlar</div><div class="card top-spend">'+(ent.length?ent.slice(0,5).map(([k,v])=>'<div class="top-spend-row"><span class="top-spend-icon">'+analysisCategoryIcon(k)+'</span><span class="top-spend-name">'+esc(k)+'<small>Bu ay</small></span><b class="top-spend-amount '+(analysisMode==='expense'?'expense':'')+'">'+money(v)+'</b></div>').join(''):'<div class="empty">Bu ay harcama bulunmuyor.</div>')+'</div>'
 +' </div>';

function budget(){
 const ym=/^\d{4}-\d{2}$/.test(budgetMonth)?budgetMonth:'2026-09';
 const monthTx=data.transactions.filter(t=>String(t.date||'').slice(0,7)===ym&&t.amount<0);
 const spentTotal=monthTx.reduce((a,t)=>a+Math.abs(Number(t.amount||0)),0);
 const totalBudget=Object.values(data.budgets||{}).reduce((a,v)=>a+Number(v||0),0);
 const remaining=totalBudget>0?totalBudget-spentTotal:0;
 const months=Array.from({length:12},(_,i)=>ym.slice(0,4)+'-'+String(i+1).padStart(2,'0'));
 const monthName=x=>{const [y,m]=x.split('-');return new Intl.DateTimeFormat('tr-TR',{month:'long',year:'numeric'}).format(new Date(Number(y),Number(m)-1,1));};
 const palette={Market:'#7aa7ff',Fatura:'#f5a06f',Ulaşım:'#55c99b',Yemek:'#ef70a1'};
 const icons={Market:sicon('market'),Fatura:sicon('invoice'),Ulaşım:sicon('transport'),Yemek:sicon('food')};
 data.goals=Array.isArray(data.goals)?data.goals:[];
 const goals=data.goals.map(g=>{const target=Math.max(0,Number(g.targetAmount||g.target||0));const saved=Math.max(0,Number(g.savedAmount??g.saved??0));const pct=target?Math.min(100,saved/target*100):0;return '<div class="goal-card" data-goal-id="'+esc(String(g.id))+'"><div class="goal-top"><span class="goal-icon">'+(g.icon==='target'?sicon('target'):(g.icon||sicon('target')))+'</span><span class="goal-main"><b>'+esc(g.name||'Finansal Hedef')+'</b><small>'+(g.targetDate?esc(g.targetDate):'Hedef tarihi belirtilmedi')+'</small></span><span class="goal-amount"><b>'+money(saved)+'</b><small>/ '+money(target)+'</small></span></div><span class="goal-bar"><i style="width:'+pct+'%"></i></span></div>'}).join('');
 const rows=Object.entries(data.budgets||{}).map(([k,v])=>{const spent=monthTx.filter(t=>t.category===k).reduce((a,t)=>a+Math.abs(Number(t.amount||0)),0);const pct=Math.min(100,v?spent/v*100:0);return '<button type="button" class="budget-item" data-budget-cat="'+esc(k)+'"><span class="budget-icon" style="background:'+((palette[k]||'#8d7cf4'))+'22;color:'+((palette[k]||'#6d5dfc'))+'">'+(icons[k]||'•')+'</span><span class="budget-mid"><span class="budget-name">'+esc(k)+'</span><span class="budget-bar"><i style="width:'+pct+'%;background:'+((palette[k]||'#6d5dfc'))+'"></i></span></span><span class="budget-right"><b>'+money(spent)+'</b><small>/ '+money(v)+'</small></span><span class="budget-chevron">›</span></button>'}).join('');
 const budgetAlerts=[];
 Object.entries(data.budgets||{}).forEach(([k,v])=>{
   const lim=Number(v)||0; if(lim<=0) return;
   const spent=monthTx.filter(t=>t.category===k).reduce((a,t)=>a+Math.abs(Number(t.amount||0)),0);
   const pct=spent/lim*100;
   if(pct>=100) budgetAlerts.push({level:'over',cat:k,spent,lim,pct});
   else if(pct>=80) budgetAlerts.push({level:'warn',cat:k,spent,lim,pct});
 });

 return '<div class="budget-page">'
 +' <div class="budget-head"><button class="budget-back" data-nav="settings" aria-label="Geri">‹</button><h1>Hedefler & Bütçe</h1></div>'

 +' <div class="budget-tools"><button type="button" class="budget-tool goal" id="addGoal">'+sicon('target')+'<span>Hedef Ekle</span></button><button type="button" class="budget-tool budget" id="addBudget">'+sicon('chart')+'<span>Bütçe Ekle</span></button></div>'

 +' <section class="budget-summary"><div><span>Toplam Bütçe</span><strong>'+money(totalBudget)+'</strong></div><div><span>Kalan</span><strong class="remaining">'+money(remaining)+'</strong></div></section>'

 +' </div>';
}




function openEditCategoryModal(type,oldName){
  const iconKeys=['home','market','shopping','food','invoice','transport','game','health','wallet','chart','coffee','card','bank','fuel','tool','heart','currency','tag','edit','bell','monitor','pharmacy','carwash','ticket','dots'];

    btn.onclick=()=>{selectedIcon=btn.dataset.icon;grid.querySelectorAll('.icon-pick-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');};
  });

    if(!n){showAlertCard('Kategori adı girin.','Eksik bilgi','error');return;}

    if(n!==oldName&&list.includes(n)){showAlertCard('Bu isimde bir kategori zaten var.','Kayıt başarısız','error');return;}
    const idx=list.indexOf(oldName);
    if(idx>=0) list[idx]=n;
    data.categoryIcons=data.categoryIcons||{};
    if(n!==oldName){
      if(data.categoryIcons[oldName]){data.categoryIcons[n]=selectedIcon;delete data.categoryIcons[oldName];}
      else data.categoryIcons[n]=selectedIcon;
      (data.transactions||[]).forEach(t=>{if(t.category===oldName)t.category=n;});
      if(data.budgets&&data.budgets[oldName]!==undefined){data.budgets[n]=data.budgets[oldName];delete data.budgets[oldName];}
    } else {
      data.categoryIcons[n]=selectedIcon;
    }
    save();modal.remove();render();
  };
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  setTimeout(()=>{const inp=document.getElementById('editCatName');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},50);
}

function moveCategory(type, fromIndex, toIndex){
  const list=data.categories[type]||[];
  if(fromIndex<0||toIndex<0||fromIndex>=list.length||toIndex>=list.length||fromIndex===toIndex) return;
  const item=list.splice(fromIndex,1)[0];
  list.splice(toIndex,0,item);
  data.categories[type]=list;
  save();
  render();
}
function bindCategoryReorder(){
  const type=window.catType||'expense';
  document.querySelectorAll('[data-cat-up]').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();const i=Number(b.dataset.catUp);if(!Number.isNaN(i))moveCategory(type,i,i-1)};
  });
  document.querySelectorAll('[data-cat-down]').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();const i=Number(b.dataset.catDown);if(!Number.isNaN(i))moveCategory(type,i,i+1)};
  });
  // Drag & drop reorder
  const listEl=document.getElementById('catList');
  if(!listEl) return;
  let dragIndex=null;
  listEl.querySelectorAll('.cat-row').forEach(row=>{
    row.draggable=true;
    row.ondragstart=e=>{
      dragIndex=Number(row.dataset.catIndex);
      row.classList.add('dragging');
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragIndex))}catch(_){}
    };
    row.ondragend=()=>{row.classList.remove('dragging');listEl.querySelectorAll('.cat-row').forEach(r=>r.classList.remove('drag-over'))};
    row.ondragover=e=>{e.preventDefault();row.classList.add('drag-over')};
    row.ondragleave=()=>row.classList.remove('drag-over');
    row.ondrop=e=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      const to=Number(row.dataset.catIndex);
      const from=dragIndex!=null?dragIndex:Number(e.dataTransfer.getData('text/plain'));
      if(!Number.isNaN(from)&&!Number.isNaN(to)) moveCategory(type,from,to);
      dragIndex=null;
    };
    // Touch long-press drag alternative: use up/down primarily on mobile
  });
}

function formatDateTR(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  const months=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const days=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()+' · '+days[d.getDay()];
}
function openDateCalendar(inputEl,labelEl){
  const cur=inputEl.value||new Date().toISOString().slice(0,10);
  let view=new Date(cur+'T00:00:00');
  let selected=cur;
  const monthsTR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const daysTR=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  const daysShort=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  const build=()=>{
    const y=view.getFullYear(),m=view.getMonth();
    const first=new Date(y,m,1);
    let start=(first.getDay()+6)%7;
    const daysIn=new Date(y,m+1,0).getDate();
    const prevDays=new Date(y,m,0).getDate();
    let cells='';
    const todayIso=new Date().toISOString().slice(0,10);
    for(let i=0;i<42;i++){
      let day,cls='cal-day',iso;
      if(i<start){day=prevDays-start+i+1;cls+=' muted';iso=new Date(y,m-1,day).toISOString().slice(0,10);}
      else if(i>=start+daysIn){day=i-start-daysIn+1;cls+=' muted';iso=new Date(y,m+1,day).toISOString().slice(0,10);}
      else{day=i-start+1;iso=new Date(y,m,day).toISOString().slice(0,10);if(iso===selected)cls+=' selected';if(iso===todayIso)cls+=' today';}
      cells+='<button type="button" class="'+cls+'" data-iso="'+iso+'">'+day+'</button>';
    }
    const headDate=new Date(selected+'T00:00:00');
    const headStr=headDate.getDate()+' '+monthsTR[headDate.getMonth()].slice(0,3)+' '+daysShort[headDate.getDay()];
    return '<div class="cal-modal" id="calModal"><div class="cal-card"><div class="cal-header"><div class="cal-year">'+y+'</div><div class="cal-big">'+headStr+'</div></div><div class="cal-nav"><button type="button" class="cal-nav-btn" id="calPrev" aria-label="Önceki">‹</button><span class="cal-month-label">'+monthsTR[m]+' '+y+'</span><button type="button" class="cal-nav-btn" id="calNext" aria-label="Sonraki">›</button></div><div class="cal-weekdays">'+daysTR.map(d=>'<span>'+d+'</span>').join('')+'</div><div class="cal-grid">'+cells+'</div><div class="cal-actions"><button type="button" class="cal-clear" id="calClear">Temizle</button><button type="button" class="cal-cancel" id="calCancel">İptal</button><button type="button" class="cal-ok" id="calOk">Ayarla</button></div></div></div>';
  };
  const mount=()=>{
    document.getElementById('calModal')?.remove();
    document.body.insertAdjacentHTML('beforeend',build());
    const modal=document.getElementById('calModal');
    modal.querySelectorAll('.cal-day').forEach(b=>b.onclick=()=>{selected=b.dataset.iso;mount();});
    document.getElementById('calPrev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);mount();};
    document.getElementById('calNext').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);mount();};
    document.getElementById('calClear').onclick=()=>{const t=new Date().toISOString().slice(0,10);inputEl.value=t;if(labelEl)labelEl.textContent=formatDateTR(t);modal.remove();};
    document.getElementById('calCancel').onclick=()=>modal.remove();
    document.getElementById('calOk').onclick=()=>{inputEl.value=selected;if(labelEl)labelEl.textContent=formatDateTR(selected);modal.remove();};
    modal.onclick=e=>{if(e.target===modal)modal.remove();};
  };
  mount();
}

 const initials=(name.trim()?name.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join(''):'İS').toUpperCase();
 const preview=current?'<img src="'+esc(current)+'" alt="Profil fotoğrafı">':esc(initials);
 const html='<div class="profile-photo-modal" id="profilePhotoModal"><div class="profile-photo-card"><div class="photo-preview" id="photoPreviewBox">'+preview+'</div><h3>Profili ayarla</h3><p>Fotoğraf seç, kırp ve kaydet.</p><div class="profile-name-field"><label>Görünen ad</label><input id="profileNameInput" value="'+esc(name)+'" placeholder="Örn: Adın" autocomplete="off" maxlength="40"></div><div class="photo-actions"><button class="photo-action primary" id="chooseProfilePhoto" type="button">Fotoğraf seç</button><button class="photo-action remove" id="removeProfilePhoto" type="button"'+(current?'':' disabled style="opacity:.45"')+'>Fotoğrafı kaldır</button><button class="photo-action close" id="closeProfilePhoto" type="button">Kaydet & Kapat</button></div><input id="profilePhotoInput" type="file" accept="image/*" hidden></div></div>';
 document.getElementById('profilePhotoModal')?.remove();
 document.getElementById('photoCropModal')?.remove();
 document.body.insertAdjacentHTML('beforeend',html);
 const m=document.getElementById('profilePhotoModal'), input=document.getElementById('profilePhotoInput');
 const nameInput=document.getElementById('profileNameInput');
 const saveName=()=>{const n=(nameInput.value||'').trim();data.settings.profileName=n;save();};
 document.getElementById('chooseProfilePhoto').onclick=()=>{input.value='';input.click()};
 document.getElementById('removeProfilePhoto').onclick=()=>{data.settings.profilePhoto='';save();const box=document.getElementById('photoPreviewBox');const n=(nameInput.value||'').trim();const ini=(n?n.split(/\s+/).map(p=>p[0]).slice(0,2).join(''):'İS').toUpperCase();if(box)box.innerHTML=esc(ini);const rm=document.getElementById('removeProfilePhoto');if(rm){rm.disabled=true;rm.style.opacity='.45'}};
 document.getElementById('closeProfilePhoto').onclick=()=>{saveName();m.remove();render()};
 m.onclick=e=>{if(e.target===m){saveName();m.remove();render()}};
 input.onchange=()=>{const file=input.files&&input.files[0];if(!file)return;if(file.size>12*1024*1024){showAlertCard('Dosya çok büyük (max 12 MB).','Fotoğraf eklenemedi','error');return}const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>openPhotoCropEditor(img,()=>{saveName();const box=document.getElementById('photoPreviewBox');if(box&&data.settings.profilePhoto)box.innerHTML='<img src="'+data.settings.profilePhoto+'" alt="Profil fotoğrafı">';const rm=document.getElementById('removeProfilePhoto');if(rm){rm.disabled=false;rm.style.opacity='1'}}) ;img.onerror=()=>showAlertCard('Fotoğraf okunamadı.','Hata','error');img.src=String(r.result||'')};r.onerror=()=>showAlertCard('Dosya okunamadı.','Hata','error');r.readAsDataURL(file)};
}
function openPhotoCropEditor(sourceImg,onDone){
 document.getElementById('photoCropModal')?.remove();
 const html='<div class="photo-crop-modal" id="photoCropModal"><div class="photo-crop-card"><div class="crop-head"><h3>Fotoğrafı ayarla</h3><p>Sürükle ve yakınlaştır, ardından uygula.</p></div><div class="crop-stage" id="cropStage"><canvas id="cropCanvas"></canvas><div class="crop-ring" aria-hidden="true"></div></div><div class="crop-zoom-row"><span class="crop-zoom-ico">−</span><input type="range" id="cropZoom" min="100" max="300" value="100" step="1" aria-label="Yakınlaştır"><span class="crop-zoom-ico">+</span></div><div class="crop-actions"><button type="button" class="crop-btn ghost" id="cropCancel">Vazgeç</button><button type="button" class="crop-btn primary" id="cropApply">Uygula</button></div></div></div>';
 document.body.insertAdjacentHTML('beforeend',html);
 const modal=document.getElementById('photoCropModal');
 const stage=document.getElementById('cropStage');
 const canvas=document.getElementById('cropCanvas');
 const zoomEl=document.getElementById('cropZoom');
 const ctx=canvas.getContext('2d');
 const size=Math.min(280, Math.floor((Math.min(window.innerWidth||360,400)-48)));
 canvas.width=size; canvas.height=size;
 stage.style.width=size+'px'; stage.style.height=size+'px';
 const iw=sourceImg.naturalWidth||sourceImg.width, ih=sourceImg.naturalHeight||sourceImg.height;
 // cover scale at zoom=1
 const baseCover=Math.max(size/iw, size/ih);
 let zoom=1, ox=0, oy=0;
 let dragging=false, lastX=0, lastY=0;
 const draw=()=>{
   const s=baseCover*zoom;
   const dw=iw*s, dh=ih*s;
   // clamp offsets so image always covers circle area
   const maxOx=Math.max(0,(dw-size)/2), maxOy=Math.max(0,(dh-size)/2);
   ox=Math.max(-maxOx, Math.min(maxOx, ox));
   oy=Math.max(-maxOy, Math.min(maxOy, oy));
   ctx.clearRect(0,0,size,size);
   ctx.save();
   ctx.beginPath();
   ctx.arc(size/2,size/2,size/2,0,Math.PI*2);
   ctx.closePath();
   ctx.clip();
   ctx.fillStyle='#1a1c28';
   ctx.fillRect(0,0,size,size);
   ctx.drawImage(sourceImg, size/2-dw/2+ox, size/2-dh/2+oy, dw, dh);
   ctx.restore();
 };
 draw();
 zoomEl.oninput=()=>{zoom=Number(zoomEl.value)/100;draw()};
 const onDown=(x,y)=>{dragging=true;lastX=x;lastY=y};
 const onMove=(x,y)=>{if(!dragging)return;ox+=x-lastX;oy+=y-lastY;lastX=x;lastY=y;draw()};
 const onUp=()=>{dragging=false};
 canvas.addEventListener('mousedown',e=>{e.preventDefault();onDown(e.clientX,e.clientY)});
 window.addEventListener('mousemove',e=>{if(dragging)onMove(e.clientX,e.clientY)});
 window.addEventListener('mouseup',onUp);
 canvas.addEventListener('touchstart',e=>{if(!e.touches[0])return;e.preventDefault();onDown(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
 canvas.addEventListener('touchmove',e=>{if(!e.touches[0])return;e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
 canvas.addEventListener('touchend',onUp);
 canvas.addEventListener('touchcancel',onUp);
 // pinch zoom
 let pinchDist=0;
 stage.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinchDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}},{passive:true});
 stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchDist){const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const factor=d/pinchDist;pinchDist=d;zoom=Math.max(1,Math.min(3,zoom*factor));zoomEl.value=String(Math.round(zoom*100));draw()}},{passive:true});
 document.getElementById('cropCancel').onclick=()=>modal.remove();
 document.getElementById('cropApply').onclick=()=>{
   // export high-res circle crop to square jpeg
   const out=document.createElement('canvas');
   const OUT=512; out.width=OUT; out.height=OUT;
   const octx=out.getContext('2d');
   const s=baseCover*zoom*(OUT/size);
   const dw=iw*s, dh=ih*s;
   const ox2=ox*(OUT/size), oy2=oy*(OUT/size);
   octx.fillStyle='#1a1c28';
   octx.fillRect(0,0,OUT,OUT);
   octx.drawImage(sourceImg, OUT/2-dw/2+ox2, OUT/2-dh/2+oy2, dw, dh);
   const dataUrl=out.toDataURL('image/jpeg',0.9);
   data.settings.profilePhoto=dataUrl;
   save();
   modal.remove();
   if(typeof onDone==='function') onDone(dataUrl);
 };
 modal.onclick=e=>{if(e.target===modal)modal.remove()};
}

function updateCloudPanel(supplied){const s=supplied||(window.DengeCloud&&window.DengeCloud.getStatus?window.DengeCloud.getStatus():null);if(!s)return;const pill=document.getElementById('cloudStatePill'),msg=document.getElementById('cloudMessage'),email=document.getElementById('cloudUserEmail'),auth=document.getElementById('cloudAuthOpen'),sync=document.getElementById('cloudSyncNow'),out=document.getElementById('cloudSignOut'),last=document.getElementById('cloudLastSync');const [label,cls]=cloudStatusInfo(s);if(pill){pill.textContent=label;pill.className='cloud-state '+cls}if(msg)msg.textContent=s.message||'';if(email){email.textContent=s.userEmail||'';email.hidden=!s.userId}if(auth)auth.hidden=!!s.userId;if(sync)sync.hidden=!s.userId;if(out)out.hidden=!s.userId;if(last)last.textContent=s.lastSyncAt?'Son eşitleme: '+new Date(s.lastSyncAt).toLocaleString('tr-TR'):(s.pending?'Bekleyen değişiklikler cihazda saklanıyor.':'')}
function showCloudAuthModal(){const status=window.DengeCloud&&window.DengeCloud.getStatus?window.DengeCloud.getStatus():null;if(!status||!status.configured){showAlertCard('Supabase Project URL ve Publishable Key ayarları cloud-config.js dosyasına girilmeli. Kurulum adımları README içinde bulunuyor.','Denge Cloud kurulumu','info');return}const html='<div class="settings-modal" id="cloudAuthModal"><div class="cloud-modal-card"><div class="pin-modal-icon">'+sicon('cloud')+'</div><h3>Denge Cloud hesabı</h3><p>Aynı e-posta hesabıyla Android ve Chrome üzerinden finans verilerini eşitle.</p><div class="cloud-field"><label for="cloudEmail">E-posta</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="ornek@eposta.com"></div><div class="cloud-field"><label for="cloudPassword">Şifre</label><input id="cloudPassword" type="password" autocomplete="current-password" minlength="8" placeholder="En az 8 karakter"></div><div class="cloud-modal-error" id="cloudAuthError" role="alert"></div><div class="cloud-modal-actions"><button type="button" class="cloud-login" id="cloudLoginBtn">Giriş yap</button><button type="button" class="cloud-register" id="cloudRegisterBtn">Hesap oluştur</button></div><div class="cloud-modal-foot"><button type="button" id="cloudAuthCancel">Vazgeç</button><button type="button" id="cloudAuthHelp">Çevrimdışı kullanım hakkında</button></div></div></div>';document.body.insertAdjacentHTML('beforeend',html);const modal=document.getElementById('cloudAuthModal'),email=document.getElementById('cloudEmail'),password=document.getElementById('cloudPassword'),error=document.getElementById('cloudAuthError'),login=document.getElementById('cloudLoginBtn'),register=document.getElementById('cloudRegisterBtn');const close=()=>modal.remove();document.getElementById('cloudAuthCancel').onclick=close;document.getElementById('cloudAuthHelp').onclick=()=>{error.textContent='Hesapla ilk giriş internet ister. Giriş yaptıktan sonra işlemler çevrimdışı kaydedilir ve bağlantı gelince eşitlenir.'};modal.onclick=e=>{if(e.target===modal)close()};const run=async action=>{const mail=email.value.trim(),pw=password.value;if(!mail||!/^\S+@\S+\.\S+$/.test(mail)){error.textContent='Geçerli bir e-posta adresi gir.';email.focus();return}if(pw.length<8){error.textContent='Şifre en az 8 karakter olmalı.';password.focus();return}login.disabled=register.disabled=true;error.textContent='İşlem yapılıyor…';try{if(action==='login'){await window.DengeCloud.signIn(mail,pw);close();updateCloudPanel();toast('Denge Cloud hesabına giriş yapıldı.')}else{const result=await window.DengeCloud.signUp(mail,pw);if(result.confirmationRequired){error.textContent='Doğrulama e-postası gönderildi. E-postanı onayladıktan sonra giriş yap.';password.value=''}else{close();updateCloudPanel();toast('Denge Cloud hesabı oluşturuldu.')}}}catch(e){error.textContent=e.message||'İşlem tamamlanamadı.'}finally{login.disabled=register.disabled=false}};login.onclick=()=>run('login');register.onclick=()=>run('signup');password.onkeydown=e=>{if(e.key==='Enter')run('login')};email.focus()}
function bindCloudUI(){const auth=document.getElementById('cloudAuthOpen'),sync=document.getElementById('cloudSyncNow'),out=document.getElementById('cloudSignOut');if(auth)auth.onclick=showCloudAuthModal;if(sync)sync.onclick=async()=>{sync.disabled=true;try{await window.DengeCloud.syncNow();toast('Denge verileri eşitlendi.')}catch(e){showAlertCard(e.message||'Eşitleme tamamlanamadı.','Denge Cloud','error')}finally{sync.disabled=false;updateCloudPanel()}};if(out)out.onclick=async()=>{try{await window.DengeCloud.signOut();updateCloudPanel();toast('Oturum kapatıldı. Cihazdaki veriler korundu.')}catch(e){showAlertCard(e.message||'Oturum kapatılamadı.','Denge Cloud','error')}}}

  document.body.insertAdjacentHTML('beforeend',p);const pm=document.getElementById('editPicker');pm.querySelectorAll('[data-edit-pick]').forEach(b=>b.onclick=()=>{if(kind==='category'){category=b.dataset.editPick;catBtn.querySelector('span').textContent=category}else{account=b.dataset.editPick;accBtn.querySelector('span').textContent=account}pm.remove()});document.getElementById('editPickerClose').onclick=()=>pm.remove();pm.onclick=e=>{if(e.target===pm)pm.remove()}

function showAddRecurring(){
 const accounts=(data.accounts||[]).filter(a=>isRealAccount(a.name));
 const cats=[...(data.categories?.expense||[]),...(data.categories?.income||[])];
 const html='<div class="settings-modal" id="recurringModal"><div class="pin-modal-card" style="text-align:left;max-width:340px"><h3 style="margin-top:0">Tekrarlayan İşlem</h3>'

  +'<label class="muted" style="font-size:11px">Ad</label><input id="recName" class="field" placeholder="Örn: Kira, Maaş" style="width:100%;margin-bottom:8px">'

  +'<label class="muted" style="font-size:11px">Hesap</label><select id="recAccount" class="field" style="width:100%;margin-bottom:8px">'+accounts.map(a=>'<option>'+esc(a.name)+'</option>').join('')+'</select>'
  +'<label class="muted" style="font-size:11px">Ayın günü (1-28)</label><input id="recDay" class="field" inputmode="numeric" value="1" style="width:100%;margin-bottom:12px">'
  +'<div class="pin-actions"><button class="pin-cancel" id="recCancel">Vazgeç</button><button class="pin-primary" id="recSave">Kaydet</button></div></div></div>';
 document.body.insertAdjacentHTML('beforeend',html);
 const m=document.getElementById('recurringModal');
 let type='expense';
 document.querySelectorAll('[data-rec-type]').forEach(b=>b.onclick=()=>{type=b.dataset.recType;document.querySelectorAll('[data-rec-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
 document.getElementById('recCancel').onclick=()=>m.remove();
 document.getElementById('recSave').onclick=()=>{

 };
 m.onclick=e=>{if(e.target===m)m.remove()};
